name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (recalculates the Excel workbook for the reconciliation test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - run: pytest -q

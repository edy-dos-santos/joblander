      <p>Connecting other providers, or switching accounts from inside the app, isn't built yet. This screen is a placeholder for that — not a working switcher.</p>
    </div>`;

  function renderPauseNote() {
    const el = wrap.querySelector('#ai-pause-note');
    if (!el) return;
    if (aiCallsPaused()) {
      el.style.display = '';
      el.innerHTML = `<div class="transparency" style="margin-top:0;margin-bottom:16px"><div class="t-title">AI calls paused in this app</div><div>You paused AI-backed features (evaluate, tailor, cover letter, CV mapping) in JobLander. This does not sign out Claude Code itself — it only pauses this app's use of it. Click Reconnect below to resume.</div></div>`;
    } else {
      el.style.display = 'none';
      el.innerHTML = '';
    }
    const disconnectBtn = wrap.querySelector('#ai-disconnect-btn');
    const reconnectBtn = wrap.querySelector('#ai-reconnect-btn');
    if (disconnectBtn) disconnectBtn.style.display = aiCallsPaused() ? 'none' : '';
    if (reconnectBtn) reconnectBtn.style.display = aiCallsPaused() ? '' : 'none';
  }

  async function refreshStatus() {
    renderPauseNote();
    const pillEl = wrap.querySelector('#ai-status-pill');
    const detailEl = wrap.querySelector('#ai-status-detail');
    const fixEl = wrap.querySelector('#ai-status-fix');
    if (!pillEl) return; // navigated away

    pillEl.className = 'status-pill checking';
    pillEl.innerHTML = `<div class="spin" style="width:13px;height:13px;border-width:2px"></div> Checking…`;
    detailEl.textContent = '';
    fixEl.style.display = 'none'; fixEl.innerHTML = '';

    const status = await checkClaudeStatus();
    const pillNow = wrap.querySelector('#ai-status-pill');
    if (!pillNow) return; // navigated away while the check was in flight

    if (status.connected) {
      pillNow.className = 'status-pill';
      pillNow.innerHTML = `${icons.check} Connected`;
    } else {
      pillNow.className = 'status-pill danger';
      pillNow.innerHTML = `${icons.x} Disconnected`;
      fixEl.style.display = '';
      fixEl.innerHTML = `<div class="transparency" style="margin-top:0"><div class="t-title">How to fix this</div><div>Open a terminal and run <code style="font-family:'DM Mono',monospace;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px">claude login</code>, then click Recheck above. This app has no sign-in screen of its own.</div></div>`;
    }
    detailEl.textContent = status.detail || '';
  }

  wrap.querySelector('#ai-recheck-btn').onclick = () => refreshStatus();

  wrap.querySelector('#ai-disconnect-btn').onclick = () => {
    AppState.settings.aiPaused = true;
    saveState();
    notify('AI calls paused in this app.', 'success');
    renderPauseNote();
  };

  wrap.querySelector('#ai-reconnect-btn').onclick = async () => {
    const btn = wrap.querySelector('#ai-reconnect-btn');
    btn.disabled = true;
    btn.textContent = 'Checking…';
    // Re-run the real check before fully re-enabling, rather than blindly
    // trusting the click — the task's own explicit requirement, and the
    // same discipline the connectivity gate uses.
    const status = await checkClaudeStatus();
    if (status.connected) {
      AppState.settings.aiPaused = false;
      saveState();
      notify('Reconnected — Claude Code is reachable.', 'success');
    } else {
      notify("Still can't reach Claude Code — AI calls remain paused.", 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Reconnect';
    await refreshStatus();
  };

  requestAnimationFrame(refreshStatus);
  return wrap;
}

// ─── PROFILE CARD MENU (Round 8 Pass 2) ───────────────────────────────────────
// Edit / Copy / Merge with / Delete for each profile card in renderHome()
// above. See runs\22-implement-round8-pass2.md for the investigation this
// is built on. Short version: a profile's CV Info CONTENT (mappedSections +
// rawText) is NOT write-only — it's retained client-side in
// user.library.infos[] (unlike Round 7's write-only app.notes finding), so
// Copy/Merge replay it straight through the EXISTING POST /v1/users + POST
// /v1/profile calls to seed a real, separate backend instance — no new
// "duplicate instance" backend endpoint was needed. The only new backend
// surface this pass adds is DELETE /v1/users/{instanceId} (server\main.py),
// used by standalone Delete and by Merge's post-confirm source cleanup.
// Edit reuses the existing Library > CV Info tab (no new editing UI built).

// Matches the exact key set MAP_CV_TASK asks the model for (see above) and
// server\instances.py's SECTION_KEYS — this IS the real shape of
// info.mappedSections, not a guess.
const CV_INFO_SECTION_KEYS = ['name', 'contact', 'websites', 'availability', 'residency', 'skills', 'summary', 'workHistory', 'education', 'certifications', 'projects'];

function closeProfileMenus() {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.remove());
}
// Registered ONCE, permanently, at script init (see the bottom of this
// script) rather than added/removed per menu-open — an earlier add-on-open/
// remove-on-select version had a real race: a fast second click (select a
// menu item right after opening it) could run closeProfileMenus()'s
// removeEventListener() before the FIRST click's deferred addEventListener
// had even fired, leaving the listener permanently attached after the menu
// was gone. A single always-on listener has no such ordering to get wrong —
// it already no-ops correctly whenever no menu is open (the `hadMenu` check
// below), so it's simpler AND race-free. Capture-phase so it runs before
// the card's own bubble-phase onclick: if a menu was actually open, this
// click's only job was to dismiss it — stop it here so the user isn't also
// navigated into the profile underneath.
function _closeProfileMenusOnOutsideClick(e) {
  if (e.target.closest('.dropdown-menu') || e.target.closest('.card-menu-btn')) return;
  const hadMenu = document.querySelector('.dropdown-menu');
  if (hadMenu) { closeProfileMenus(); e.stopPropagation(); }
}

function toggleProfileMenu(event, userId) {
  event.stopPropagation();
  const btn = event.currentTarget || event.target.closest('.card-menu-btn');
  const already = btn.parentElement.querySelector('.dropdown-menu');
  closeProfileMenus();
  if (already) return; // clicking the same trigger again just closes it

  const user = getUser(userId);
  if (!user) return;

  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';
  menu.onclick = (e) => e.stopPropagation(); // don't let a stray click inside the menu bubble to the card
  menu.innerHTML = `
    <button class="dropdown-item" data-act="edit">${icons.edit} Edit</button>
    <button class="dropdown-item" data-act="copy">${icons.copy} Copy</button>
    <button class="dropdown-item" data-act="merge">${icons.merge} Merge with…</button>
    <button class="dropdown-item danger" data-act="delete">${icons.trash} Delete</button>`;
  btn.parentElement.appendChild(menu);

  menu.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); closeProfileMenus(); editProfileCvInfo(userId); };
  menu.querySelector('[data-act="copy"]').onclick = (e) => { e.stopPropagation(); closeProfileMenus(); copyProfile(userId); };
  menu.querySelector('[data-act="merge"]').onclick = (e) => { e.stopPropagation(); closeProfileMenus(); openMergePicker(userId); };
  menu.querySelector('[data-act="delete"]').onclick = (e) => { e.stopPropagation(); closeProfileMenus(); deleteProfilePrompt(userId); };
}

// ── Edit ── Reuses the existing per-profile Library view (Template / CV
// Info / Cover Letters tabs, reachable today from userHome's "Swap"
// buttons) — confirmed during investigation to already let a user update
// CV Info after profile creation (upload a new file or paste new text,
// remap, set active, delete old entries). No second, redundant editing
// surface was built; this just jumps straight to the CV Info tab.
function editProfileCvInfo(userId) {
  AppState._libTab = 'infos';
  setView('library', { activeUserId: userId });
}

// ── Copy ── Duplicates a profile: new name, a genuinely separate backend
// instance seeded with the same CV Info content, and its own independent
// library. Judgment call: the ENTIRE library (templates, CV infos, cover
// letters) is duplicated, not left empty — reasoning: this app has no
// backend representation for templates/cover letters at all (they're
// pure client-side b64 blobs — see server\instances.py's own docstring:
// "no upload endpoint exists yet"), so duplicating them costs nothing
// server-side, and a "Copy" that silently drops the user's saved
// templates/cover letters would be a surprising, less useful copy than
// one that's immediately usable exactly like the original.
async function copyProfile(userId) {
  const src = getUser(userId);
  if (!src) return;

  // Every cloned item gets a FRESH id — a true independent copy, not an
  // alias — and its own mappedSections object (shallow-cloned; nothing
  // downstream mutates it in place today, but sharing the same object
  // reference between two profiles would be a latent bug waiting to
  // happen the first time something does).
  function cloneItems(items) {
    const idMap = {};
    const cloned = (items || []).map(it => {
      const newId = uid();
      idMap[it.id] = newId;
      return { ...it, id: newId, mappedSections: it.mappedSections ? { ...it.mappedSections } : (it.mappedSections ?? null), addedAt: Date.now() };
    });
    return { cloned, idMap };
  }
  const { cloned: templates, idMap: tMap } = cloneItems(src.library?.templates);
  const { cloned: infos, idMap: iMap } = cloneItems(src.library?.infos);
  const { cloned: coverLetters } = cloneItems(src.library?.coverLetters);

  const copy = {
    id: uid(),
    name: `${src.name} (copy)`,
    instanceId: null, // never shares the original's instanceId — provisioned fresh below
    outputFormat: src.outputFormat || 'docx',
    activeTemplateId: src.activeTemplateId ? (tMap[src.activeTemplateId] || null) : null,
    activeInfoId: src.activeInfoId ? (iMap[src.activeInfoId] || null) : null,
    library: { templates, infos, coverLetters },
    createdAt: Date.now(),
  };
  AppState.users.push(copy);
  saveState();
  notify(`Copied "${src.name}" → "${copy.name}"`);
  render();

  // Provision a genuinely separate backend instance for the copy, seeded
  // with the SAME CV Info content the original has active right now —
  // a plain replay through the EXISTING POST /v1/users + POST /v1/profile
  // calls (ensureInstance), since that content already lives client-side.
  // Fire-and-forget, same non-blocking pattern createUser() already uses.
  ensureInstance(copy);
}

// ── Merge with… ── Step 1: pick the OTHER profile to combine with. Step 2
// (showMergePreview) shows the mandatory concrete preview before anything
// happens. CORRECTED SEMANTICS (see runs\23-implement-round8-mergefix.md):
// merge is NON-DESTRUCTIVE. It creates a brand-new THIRD profile combining
// both source profiles' CV info and library; neither source profile is ever
// modified, moved-from, or deleted.
function openMergePicker(sourceId) {
  const source = getUser(sourceId);
  if (!source) return;
  const others = AppState.users.filter(u => u.id !== sourceId);

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px';

  if (others.length === 0) {
    modal.innerHTML = `<div class="card" style="max-width:380px;width:100%">
      <h3 style="margin-bottom:8px">Merge with…</h3>
      <p style="font-size:14px;color:var(--text2);margin-bottom:16px">You need at least one other profile to merge "${escAttr(source.name)}" with.</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn btn-secondary" id="merge-close">Close</button></div>
    </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#merge-close').onclick = () => modal.remove();
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    return;
  }

  modal.innerHTML = `<div class="card" style="max-width:420px;width:100%">
    <h3 style="margin-bottom:6px">Merge "${escAttr(source.name)}" with…</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Choose another profile to combine with "${escAttr(source.name)}". This creates a brand-new third profile — both "${escAttr(source.name)}" and the profile you pick here stay completely unchanged, applications and all.</p>
    <fieldset style="border:none;padding:0;margin:0 0 16px 0;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto">
      <legend class="sr-only">Profile to combine with</legend>
      ${others.map(u => {
        const n = getApplicationsForUser(u.id).length;
        return `<label class="radio-card" style="min-width:0" data-target-row="${u.id}">
          <input type="radio" name="merge-target" value="${u.id}" class="sr-only">
          <h4>${escAttr(u.name)}</h4>
          <p>${n} application${n !== 1 ? 's' : ''} · ${getActiveInfo(u) ? 'CV info set' : 'No CV info'}</p>
        </label>`;
      }).join('')}
    </fieldset>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" id="merge-cancel">Cancel</button>
      <button class="btn btn-primary" id="merge-continue" disabled>Continue</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  const continueBtn = modal.querySelector('#merge-continue');
  modal.querySelectorAll('input[name="merge-target"]').forEach(r => {
    r.addEventListener('change', () => {
      modal.querySelectorAll('[data-target-row]').forEach(row => row.classList.toggle('selected', row.dataset.targetRow === r.value));
      continueBtn.disabled = false;
    });
  });
  modal.querySelector('#merge-cancel').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  continueBtn.onclick = () => {
    const targetId = modal.querySelector('input[name="merge-target"]:checked')?.value;
    if (!targetId) return;
    modal.remove();
    showMergePreview(sourceId, targetId);
  };
}

// Combines two CV Info payloads. Judgment call, documented: COMBINE
// (concatenate), not "pick one profile as primary" — merging two profiles
// should never silently discard one side's real career content. Downside:
// fields both profiles filled in (e.g. "name", "contact") will show both
// values back to back, labeled by source — the mandatory preview
// (showMergePreview) shows the user exactly this text before they confirm,
// and the result can always be cleaned up afterward via the ordinary
// Library > CV Info edit path (paste a tidied version), same as any other
// CV Info update.
function combineSections(targetSections, sourceSections, targetName, sourceName) {
  if (!targetSections && !sourceSections) return null;
  const out = {};
  CV_INFO_SECTION_KEYS.forEach(k => {
    const t = (targetSections?.[k] || '').trim();
    const s = (sourceSections?.[k] || '').trim();
    if (t && s) out[k] = `${t}\n\n[From ${sourceName}]\n${s}`;
    else out[k] = t || s || '';
  });
  return out;
}
function combineRawText(targetRaw, sourceRaw, sourceName) {
  const t = (targetRaw || '').trim();
  const s = (sourceRaw || '').trim();
  if (t && s) return `${t}\n\n===== Merged from "${sourceName}" =====\n\n${s}`;
  return t || s || '';
}

// Step 2 of Merge — the mandatory concrete preview. CORRECTED (see
// runs\23-implement-round8-mergefix.md): this now previews the creation of a
// brand-new THIRD profile, not an overwrite-and-delete. Shows both source
// profiles' real CV info (which will combine into the new profile), lets the
// user edit the new profile's name, and states plainly that both sources are
// untouched and the new profile starts with zero applications. Nothing is
// created — no data moves, nothing is deleted or modified — until "Create
// merged profile" is explicitly clicked.
function showMergePreview(sourceId, targetId) {
  const source = getUser(sourceId), target = getUser(targetId);
  if (!source || !target) return;

  const sInfo = getActiveInfo(source), tInfo = getActiveInfo(target);
  const defaultName = `${source.name} + ${target.name}`;

  const snippet = (info) => {
    if (!info) return '<em>No CV info set</em>';
    const raw = (info.rawText || Object.values(info.mappedSections || {}).join(' ')).trim();
    const preview = raw.slice(0, 220);
    return `<strong>${escAttr(info.name)}</strong><br><span style="color:var(--text2)">${escAttr(preview)}${raw.length > 220 ? '…' : ''}</span>`;
  };

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto';
  modal.innerHTML = `<div class="card" style="max-width:520px;width:100%;border-top:4px solid var(--mustard);margin:20px 0">
    <h3 style="margin-bottom:4px">Create merged profile</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">This creates a brand-new profile combining "${escAttr(source.name)}" and "${escAttr(target.name)}". <strong>Both stay completely unchanged</strong> — nothing is deleted or modified. Review below, then confirm.</p>

    <div class="field-group" style="margin-bottom:16px">
      <label for="merge-new-name">New profile name</label>
      <input id="merge-new-name" type="text" value="${escAttr(defaultName)}" autocomplete="off">
    </div>

    <div class="section-title" style="margin-bottom:6px">CV info that will combine</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <div class="card card-sm"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px">"${escAttr(source.name)}" (unchanged)</div><div style="font-size:14px">${snippet(sInfo)}</div></div>
      <div class="card card-sm"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px">"${escAttr(target.name)}" (unchanged)</div><div style="font-size:14px">${snippet(tInfo)}</div></div>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Both texts above will be <strong>combined</strong> into the new profile's CV info (nothing discarded). The new profile also gets its own copy of both profiles' saved templates and cover letters, and starts with <strong>zero applications</strong> — each original profile keeps its own application history exactly as it is.</p>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" id="merge-preview-cancel">Cancel</button>
      <button class="btn btn-primary" id="merge-preview-confirm">Create merged profile</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  const nameInput = modal.querySelector('#merge-new-name');
  const confirmBtn = modal.querySelector('#merge-preview-confirm');
  nameInput.addEventListener('input', () => { confirmBtn.disabled = nameInput.value.trim() === ''; });
  modal.querySelector('#merge-preview-cancel').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  confirmBtn.onclick = async () => {
    const newName = nameInput.value.trim() || defaultName;
    confirmBtn.disabled = true; confirmBtn.textContent = 'Creating…';
    try {
      await performMerge(sourceId, targetId, newName);
    } finally {
      modal.remove();
    }
  };
}

// Same fresh-id duplication pattern copyProfile()'s own cloneItems() uses,
// applied here to BOTH source profiles' library items when building a merged
// profile. Deliberately a SEPARATE top-level function, not a shared/extracted
// one — this keeps copyProfile()'s own code path provably untouched by this
// fix (scope discipline: fix ONLY Merge). Returns the cloned array; ids are
// always fresh, never shared with either original.
function cloneLibraryItemsForMerge(items) {
  return (items || []).map(it => ({
    ...it,
    id: uid(),
    mappedSections: it.mappedSections ? { ...it.mappedSections } : (it.mappedSections ?? null),
    addedAt: Date.now(),
  }));
}

// Executes a confirmed merge. CORRECTED SEMANTICS (post-Pass-2 owner
// correction — see runs\23-implement-round8-mergefix.md): this NEVER deletes
// or modifies either source profile. Instead it creates a brand-new THIRD
// profile — same mechanism as Copy (fresh id, fresh instanceId, duplicated
// library, POST /v1/users + POST /v1/profile) — seeded from BOTH sources'
// combined CV info and combined library instead of just one profile's data.
// `source`/`target` here are just "the two profiles chosen to combine" —
// neither is ever written to, moved from, or removed. Called only from
// showMergePreview's confirm button — never reachable without the user
// having seen the preview above.
async function performMerge(sourceId, targetId, newName) {
  const source = getUser(sourceId), target = getUser(targetId);
  if (!source || !target) return;

  const sInfo = getActiveInfo(source), tInfo = getActiveInfo(target);
  // Reuses the existing combine logic unchanged (see combineSections/
  // combineRawText above) — only what it's used FOR changed.
  const mergedSections = combineSections(sInfo?.mappedSections, tInfo?.mappedSections, source.name, target.name);
  const mergedRawText = combineRawText(sInfo?.rawText, tInfo?.rawText, target.name);

  // Duplicate BOTH profiles' entire libraries into the new profile — same
  // "duplicate everything, fresh ids" judgment call Copy already made for a
  // single profile (§6 of runs\22-implement-round8-pass2.md), just applied
  // to two sources. Neither original's library array is read destructively
  // (map() only) or mutated.
  const mergedTemplates = [
    ...cloneLibraryItemsForMerge(source.library?.templates),
    ...cloneLibraryItemsForMerge(target.library?.templates),
  ];
  const mergedInfos = [
    ...cloneLibraryItemsForMerge(source.library?.infos),
    ...cloneLibraryItemsForMerge(target.library?.infos),
  ];
  const mergedCoverLetters = [
    ...cloneLibraryItemsForMerge(source.library?.coverLetters),
    ...cloneLibraryItemsForMerge(target.library?.coverLetters),
  ];

  const combinedInfoId = uid();
  mergedInfos.push({
    id: combinedInfoId,
    name: `Merged CV Info (${source.name} + ${target.name})`,
    source: 'merge',
    mappedSections: mergedSections,
    rawText: mergedRawText,
    addedAt: Date.now(),
  });

  // NEW third profile. instanceId starts null — a genuinely separate backend
  // instance is provisioned below, never sharing either source's. Starts
  // with ZERO applications (judgment call, documented in
  // runs\23-implement-round8-mergefix.md): since neither source profile is
  // removed or modified, each keeps its own existing application history
  // with an unambiguous home already — the merged profile has no claim on
  // either side's history, so it starts fresh rather than copying anything.
  const merged = {
    id: uid(),
    name: newName || `${source.name} + ${target.name}`,
    instanceId: null,
    outputFormat: source.outputFormat || target.outputFormat || 'docx',
    activeTemplateId: null,
    activeInfoId: combinedInfoId,
    library: { templates: mergedTemplates, infos: mergedInfos, coverLetters: mergedCoverLetters },
    createdAt: Date.now(),
  };

  // Neither `source` nor `target` is written to anywhere above or below —
  // no application reassignment, no library push onto either original, no
  // backend delete call for either.
  AppState.users.push(merged);
  saveState();
  notify(`Created "${merged.name}" from "${source.name}" + "${target.name}" — both original profiles are unchanged.`);
  render();

  // Fresh backend instance for the merged profile, seeded with the combined
  // CV info — the exact same POST /v1/users + POST /v1/profile replay
  // ensureInstance() already does for Copy (fire-and-forget, same
  // non-blocking pattern copyProfile()/createUser() already use).
  ensureInstance(merged);
}

// ── Delete ── Shared by standalone profile delete and merge's source
// cleanup. Removes the AppState.users entry (+ its applications, unless
// the caller already moved them — merge does), then deletes the backend
// instance directory via the new DELETE /v1/users/{instanceId} endpoint.
async function deleteProfileEverywhere(user, opts = {}) {
  if (!opts.skipAppCleanup) {
    _applications = _applications.filter(a => a.userId !== user.id);
  }
  AppState.users = AppState.users.filter(u => u.id !== user.id);
  saveState();
  if (user.instanceId) {
    try {
      await backendFetch(`${BACKEND_BASE}/v1/users/${encodeURIComponent(user.instanceId)}`, { method: 'DELETE' });
    } catch (e) {
      console.warn('Backend instance delete failed:', e.message);
      notify(`"${user.name}" removed locally, but its backend workspace could not be deleted: ${e.message}`, 'error');
    }
  }
}

// Standalone profile delete — same inline-modal pattern deleteApp() already
// uses for applications (confirm() is blocked in artifact iframes), but
// MORE prominent, per the task brief: a danger-colored top border, the
// full list of what's lost spelled out, and a type-the-exact-name
// confirmation input (stronger than deleteApp's plain Cancel/Delete,
// deliberately — deleting a whole profile is more consequential than
// deleting one application).
function deleteProfilePrompt(userId) {
  const user = getUser(userId);
  if (!user) return;
  const appCount = getApplicationsForUser(userId).length;

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `<div class="card" style="max-width:400px;width:100%;border-top:4px solid var(--danger)">
    <h3 style="margin-bottom:8px;color:var(--danger-text)">Delete profile "${escAttr(user.name)}"?</h3>
    <p style="font-size:14px;color:var(--text2);margin-bottom:14px">
      This permanently deletes the profile, its CV info, templates and cover letters, and
      ${appCount} application${appCount !== 1 ? 's' : ''} — both on this computer and its workspace on the
      local backend. <strong>This cannot be undone.</strong>
    </p>
    <div class="field-group">
      <label for="del-profile-confirm-input">Type <strong>${escAttr(user.name)}</strong> to confirm</label>
      <input id="del-profile-confirm-input" type="text" autocomplete="off">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
      <button class="btn btn-secondary" id="del-profile-cancel">Cancel</button>
      <button class="btn btn-danger" id="del-profile-confirm" disabled>Delete profile</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  const input = modal.querySelector('#del-profile-confirm-input');
  const confirmBtn = modal.querySelector('#del-profile-confirm');
  input.oninput = () => { confirmBtn.disabled = input.value !== user.name; };
  modal.querySelector('#del-profile-cancel').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  confirmBtn.onclick = async () => {
    if (input.value !== user.name) return;
    confirmBtn.disabled = true; confirmBtn.textContent = 'Deleting…';
    await deleteProfileEverywhere(user);
    modal.remove();
    notify(`Deleted profile "${user.name}"`);
    setView('home');
  };
  input.focus();
}

// ─── GUIDED Q&A PROFILE INTAKE (P4) ───────────────────────────────────────────
// A third way to populate CV Info, alongside upload-a-file and paste-a-CV
// (neither of which is removed or changed). Each short question is
// independently skippable. Answers are compiled into one plain-text blob
// with the exact same shape a hand-typed paste would have, then handed to
// the SAME `state.infoPaste` variable and the SAME submit path
// (runMapCvTask -> createUser -> POST /v1/profile) the paste box already
// uses — see renderInfoStep()/attachHandlers() below. That means this
// feature needed zero backend changes: the server never learns the
// difference between a pasted CV and a compiled Q&A answer set.
const QA_FIELDS = [
  { key: 'name', q: "What's your name?", placeholder: 'e.g. Alex Johnson', hint: 'So the AI addresses you correctly in the profile.' },
  { key: 'title', q: "What's your current or target job title?", placeholder: 'e.g. Senior Data Analyst', hint: '' },
  { key: 'summary', q: 'Present yourself in a couple of sentences.', placeholder: 'e.g. Data analyst with 5 years in financial services, focused on reporting and compliance.', multiline: true, hint: 'This becomes your professional summary.' },
  { key: 'skills', q: 'What are your key skills?', placeholder: 'e.g. SQL, Power BI, Python, stakeholder management', multiline: true, hint: 'One per line or comma-separated — either works.' },
  { key: 'workHistory', q: 'Walk through your work history.', placeholder: 'e.g. Data Analyst, ABC Corp, 2021–Present — built reporting dashboards, automated reconciliation...', multiline: true, hint: 'One role per line or short paragraph: title, company, dates, what you did.' },
  { key: 'education', q: "What's your education?", placeholder: 'e.g. B.Sc Computer Science, University of Melbourne, 2018', multiline: true, hint: '' },
  { key: 'certifications', q: 'Any certifications or licenses?', placeholder: 'e.g. AWS Certified Solutions Architect (2022)', multiline: true, hint: '' },
  { key: 'projects', q: 'Any notable projects worth mentioning?', placeholder: 'e.g. Built an internal tool that cut reporting time in half.', multiline: true, hint: '' },
  { key: 'contact', q: 'Contact details?', placeholder: 'e.g. alex@email.com, +61 4xx xxx xxx, Brisbane QLD', hint: 'Email, phone, location.' },
  { key: 'websites', q: 'Any links? LinkedIn, portfolio, GitHub…', placeholder: 'e.g. linkedin.com/in/alexjohnson', hint: '' },
  { key: 'availability', q: 'Work rights, residency, or availability?', placeholder: 'e.g. Full working rights in Australia, available immediately', hint: '' },
];
const QA_FIELD_LABELS = {
  name: 'Name', title: 'Title', summary: 'Summary', skills: 'Skills',
  workHistory: 'Work History', education: 'Education', certifications: 'Certifications',
  projects: 'Projects', contact: 'Contact', websites: 'Websites',
  availability: 'Availability / Work rights',
};
// Compiles whatever was answered (skipped questions are simply omitted, not
// written as a placeholder — an empty section would just be noise for the
// mapping AI) into one labeled plain-text blob, same shape as a hand-typed
// paste.
function buildQaRawText(answers) {
  return QA_FIELDS
    .map(f => ({ label: QA_FIELD_LABELS[f.key], val: (answers[f.key] || '').trim() }))
    .filter(({ val }) => val)
    .map(({ label, val }) => `${label}:\n${val}`)
    .join('\n\n');
}

function renderNewUser() {

  // P0 (Round 7): simulated staged narrative for the CV-mapping wait — see
  // the WAIT NARRATIVE section's comment for what this is/isn't.
  const MAP_CV_STAGES = [
    [0, 'Reading your CV…'],
    [10, 'Identifying sections — work history, skills, education…'],
    [25, 'Structuring everything into a clean profile…'],
    [45, 'Almost done — finalising the mapped sections…'],
  ];

  async function createUser(templateB64, templateName, mappedSections, infoName, rawText) {
      const tid = templateB64 ? uid() : null;
      const iid = mappedSections || (rawText && rawText.trim()) ? uid() : null;
      const user = {
        id: uid(), name: state.name,
        instanceId: null,
        outputFormat: state.outputFormat || 'docx',
        activeTemplateId: tid,
        activeInfoId: iid,
        library: {
          templates: tid ? [{ id: tid, name: templateName || 'CV Template', b64: templateB64, type: templateName?.endsWith('.pdf') ? 'pdf' : (templateName?.endsWith('.tex') ? 'tex' : 'docx'), addedAt: Date.now(), source: 'upload' }] : [],
          infos: iid ? [{ id: iid, name: infoName || 'CV Info', source: state.infoMode, mappedSections: mappedSections || null, rawText: rawText || null, addedAt: Date.now() }] : [],
          coverLetters: [],
        },
        createdAt: Date.now(),
      };
      AppState.users.push(user);
      saveState();
      notify(`Profile created for ${state.name}`);
      setView('userHome', { activeUserId: user.id });
      // Provision the backend workspace and populate it with whatever profile
      // info was just collected. Doesn't block the UI transition above — on
      // failure this just leaves instanceId null, and the next thing that
      // needs it (ensureInstance, called at the start of the tailoring flow)
      // retries.
      const instanceId = await ensureInstance(user);
      if (instanceId) {
        // Always re-sync with rawText so the instance never ends name-only.
        await backendFetch(`${BACKEND_BASE}/v1/profile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instanceId, name: user.name, outputFormat: user.outputFormat, sections: mappedSections, rawText }),
        }).catch(() => {});
      }
    }

    function attachHandlers() {
      // Name step
      const nameNext = wrap.querySelector('#name-next');
      if (nameNext) nameNext.onclick = () => {
        const val = wrap.querySelector('#new-name')?.value.trim();
        if (!val) { state.error = 'Please enter your name.'; localRender(); return; }
        state.name = val; state.step = 'template'; state.error = ''; localRender();
      };

      // Template step
      const tmplFile = wrap.querySelector('#tmpl-file');
      if (tmplFile) tmplFile.onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        state.templateFile = f; state.error = ''; localRender();
      };
      const tmplZone = wrap.querySelector('#tmpl-zone');
    if (tmplZone) {
      tmplZone.ondragover = e => { e.preventDefault(); tmplZone.classList.add('drag'); };
      tmplZone.ondragleave = () => tmplZone.classList.remove('drag');
      tmplZone.ondrop = e => { e.preventDefault(); tmplZone.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) { state.templateFile = f; localRender(); } };
    }
    const tmplBack = wrap.querySelector('#tmpl-back');
    if (tmplBack) tmplBack.onclick = () => { state.step = 'name'; state.error = ''; localRender(); };
    const tmplSkip = wrap.querySelector('#tmpl-skip');
    if (tmplSkip) tmplSkip.onclick = () => { state.templateFile = null; state.step = 'info'; state.error = ''; localRender(); };
    const tmplNext = wrap.querySelector('#tmpl-next');
    if (tmplNext) tmplNext.onclick = () => { state.step = 'info'; state.error = ''; localRender(); };

    // Info step — mode toggles (P4: 'qa' added as a third option, side by
    // side with 'upload' and 'paste' — neither of those two is touched).
    // P1c (Round 7): these are now real <input type="radio"> elements (see
    // renderInfoStep) — listening for 'change' rather than 'click' on the
    // label means keyboard arrow-key navigation within the group (native
    // radio-group behaviour) triggers this too, not just a mouse click.
    wrap.querySelectorAll('input[name="info-mode"]').forEach(r => {
      r.addEventListener('change', () => {
        if (!r.checked) return;
        state.infoMode = r.value;
        // F1 (Round 7 follow-up): localRender() below replaces wrap's
        // innerHTML, destroying the input the browser was tracking focus
        // on — an arrow-key selection would otherwise dump a keyboard user
        // to <body> after exactly one keypress. Capture name/value before
        // the rebuild and refocus the equivalent input afterwards.
        const name = r.name, value = r.value;
        localRender();
        wrap.querySelector(`input[name="${name}"][value="${value}"]`)?.focus();
      });
    });
    const infoFile = wrap.querySelector('#info-file');
    if (infoFile) infoFile.onchange = e => { const f = e.target.files[0]; if (f) { state.infoFile = f; localRender(); } };
    const infoPasteEl = wrap.querySelector('#info-paste');
    if (infoPasteEl) infoPasteEl.oninput = e => {
      state.infoPaste = e.target.value;
      // Don't call localRender() here - it rebuilds this whole card's innerHTML
      // (recreating the textarea) and would drop focus/cursor position on every
      // keystroke. Toggle the Create-profile button directly off the live value
      // instead, so it enables immediately without needing another control to
      // force a re-render first (P2-1).
      const saveBtn = wrap.querySelector('#info-save');
      if (saveBtn && !state.processing) saveBtn.disabled = !e.target.value.trim();
    };

    // P4 — guided Q&A question navigation. Compiling into state.infoPaste
    // (finishQa) is the ONLY handoff point into the pre-existing paste/save
    // path below — after that, #info-save's onclick can't tell a compiled
    // Q&A answer set from a hand-typed paste, by design.
    const qaInput = wrap.querySelector('#qa-input');
    if (qaInput) qaInput.oninput = e => { state.qaAnswers[QA_FIELDS[state.qaStep].key] = e.target.value; };
    const finishQa = () => { state.infoPaste = buildQaRawText(state.qaAnswers); state.qaDone = true; localRender(); };
    const qaPrev = wrap.querySelector('#qa-prev');
    if (qaPrev) qaPrev.onclick = () => { state.qaStep = Math.max(0, state.qaStep - 1); localRender(); };
    const advanceQa = () => { if (state.qaStep < QA_FIELDS.length - 1) { state.qaStep++; localRender(); } else finishQa(); };
    const qaSkip = wrap.querySelector('#qa-skip');
    // P9 — Skip must actually skip. This used to be the exact same handler
    // as Next (both just `advanceQa`), so an answer already typed into the
    // current question survived a "Skip" click and still ended up in the
    // compiled output. buildQaRawText() (above) already treats an empty/
    // whitespace-only answer as fully omitted, so clearing the current
    // answer here — before advancing — is what makes "Skip this question"
    // actually consistent with that "skipped == omitted" contract.
    if (qaSkip) qaSkip.onclick = () => { state.qaAnswers[QA_FIELDS[state.qaStep].key] = ''; advanceQa(); };
    const qaNext = wrap.querySelector('#qa-next');
    if (qaNext) qaNext.onclick = advanceQa;
    const qaFinishEarly = wrap.querySelector('#qa-finish-early');
    if (qaFinishEarly) qaFinishEarly.onclick = finishQa;
    const qaRedo = wrap.querySelector('#qa-redo');
    if (qaRedo) qaRedo.onclick = (e) => { e.preventDefault(); state.qaDone = false; state.qaStep = 0; localRender(); };

    wrap.querySelectorAll('input[name="new-output-format"]').forEach(r => {
      r.addEventListener('change', () => {
        if (!r.checked) return;
        state.outputFormat = r.value;
        // F1 (Round 7 follow-up): same localRender()-destroys-focus fix as
        // the info-mode group above.
        const name = r.name, value = r.value;
        localRender();
        wrap.querySelector(`input[name="${name}"][value="${value}"]`)?.focus();
      });
    });
    // P0 (Round 7): Back/Skip are disabled while processing (see
    // renderInfoStep) so they can't race the in-flight mapping call — Cancel
    // (below) is now the one intended way out of the wait.
    const infoBack = wrap.querySelector('#info-back');
    if (infoBack) infoBack.onclick = () => { if (state.processing) return; state.step = 'template'; state.error = ''; localRender(); };
    const infoSkip = wrap.querySelector('#info-skip');
    if (infoSkip) infoSkip.onclick = async () => {
      if (state.processing) return;
      const templateB64 = state.templateFile ? await fileToB64(state.templateFile) : null;
      await createUser(templateB64, state.templateFile?.name, null, null, '');
    };
    const infoCancelMap = wrap.querySelector('#info-cancel-map');
    if (infoCancelMap) infoCancelMap.onclick = () => {
      // P0 (Round 7): real cancel — abort the in-flight mapping call and
      // return to the (now re-enabled) form, no partial/broken state. The
      // catch block below explicitly no-ops on AbortError so it doesn't
      // also show an "Error: ..." message right after this resets cleanly.
      state.mapController?.abort();
      state.processing = false;
      state.error = '';
      localRender();
    };
    const infoSave = wrap.querySelector('#info-save');
    if (infoSave) infoSave.onclick = async () => {
      state.processing = true; state.error = ''; localRender();
      const controller = new AbortController();
      state.mapController = controller;
      const stopTimer = startElapsedTicker(sec => {
        const textEl = wrap.querySelector('#map-status-text');
        const elEl = wrap.querySelector('#map-status-elapsed');
        if (textEl) textEl.textContent = stageText(MAP_CV_STAGES, sec);
        if (elEl) elEl.textContent = `${sec}s`;
      });
      try {
        const templateB64 = state.templateFile ? await fileToB64(state.templateFile) : null;
        let rawText = '';
        if (state.infoMode === 'upload' && state.infoFile) {
          if (state.infoFile.name.endsWith('.pdf')) {
            rawText = await extractPdfText(state.infoFile);
          } else {
            rawText = await extractDocxText(state.infoFile);
          }
        } else {
          // Covers both 'paste' and 'qa' (P4) — a finished Q&A run compiles
          // its answers into state.infoPaste (see finishQa above), so this
          // branch reads identically for both sources.
          rawText = state.infoPaste;
        }
        const { sections } = await runMapCvTask(rawText, controller.signal);
        const infoName = state.infoMode === 'upload' ? state.infoFile.name : state.infoMode === 'qa' ? 'Guided Q&A intake' : 'Pasted CV info';
        await createUser(templateB64, state.templateFile?.name, sections, infoName, rawText);
      } catch (e) {
        if (e.name === 'AbortError') { stopTimer(); return; } // Cancel already reset state + re-rendered
        state.error = `Error: ${e.message}`; state.processing = false; localRender();
        stopTimer();
        return;
      }
      stopTimer();
    };
  }

  localRender();
  return wrap;
}

function renderAppList(container, userId) {
  const apps = getApplicationsForUser(userId);
  const user = getUser(userId);
  if (apps.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <h3>No applications yet</h3>
        <p>Start by creating a new application above.</p>
      </div>`;
    return;
  }

  apps.sort((a, b) => b.createdAt - a.createdAt).forEach(app => {
    const div = document.createElement('div');
    div.className = 'app-item';

    const resumeStatus = app.resume?.status || 'pending';
    const letterStatus = app.coverLetter?.status || 'none';

    const statusBadge = (s) => {
      const map = { done: ['badge-green', 'Done'], running: ['badge-blue', 'In progress'], error: ['badge-red', 'Error'], pending: ['badge-gray', 'Not started'], none: ['badge-gray', 'Not created'] };
      const [cls, label] = map[s] || map.pending;
      return `<span class="badge ${cls}">${label}</span>`;
    };

    div.innerHTML = `
      <div class="app-item-header">
        <div>
          <div class="app-item-title">${app.positionName || 'Untitled role'}</div>
          <div class="app-item-sub">${app.company || 'Unknown company'} · ${fmtDate(app.createdAt)}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteApp('${app.id}')" title="Delete" aria-label="Delete application: ${escAttr(app.positionName || 'Untitled role')}">${icons.trash}</button>
      </div>
      <div class="app-row">
        <span class="label">Resume</span>
        ${statusBadge(resumeStatus)}
        ${app.resume?.tokensUsed ? `<span class="token-pill">${fmtTokens(app.resume.tokensUsed)}</span>` : ''}
        ${(app.resume?.files || []).map((f, i) => `<a href="#" class="btn btn-sm btn-ghost" data-dl-resume="${i}" title="${f}" aria-label="Download ${escAttr(f)}">${icons.dl}</a>`).join('')}
      </div>
      <div class="app-row">
        <span class="label">Cover letter</span>
        ${statusBadge(letterStatus)}
        ${app.coverLetter?.tokensUsed ? `<span class="token-pill">${fmtTokens(app.coverLetter.tokensUsed)}</span>` : ''}
        ${(app.coverLetter?.files || []).map((f, i) => `<a href="#" class="btn btn-sm btn-ghost" data-dl-cover="${i}" title="${f}" aria-label="Download ${escAttr(f)}">${icons.dl}</a>`).join('')}
      </div>`;

    // P5 fix: download links now go through downloadGeneratedFile (fetch ->
    // blob -> detached <a>) instead of a bare href, and their click handler
    // is attached as a real listener (not an inline onclick string) so
    // e.stopPropagation() reliably runs before the card's own div.onclick
    // (below) - which does a full setView()/render() - can ever see the
    // event. See downloadGeneratedFile's comment (~line 536) for why a bare
    // href was the suspected P5 root cause.
    div.querySelectorAll('[data-dl-resume]').forEach(el => {
      el.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        downloadGeneratedFile(user.instanceId, (app.resume?.files || [])[+el.dataset.dlResume], el);
      };
    });
    div.querySelectorAll('[data-dl-cover]').forEach(el => {
      el.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        downloadGeneratedFile(user.instanceId, (app.coverLetter?.files || [])[+el.dataset.dlCover], el);
      };
    });

    div.onclick = () => {
      AppState.activeApplicationId = app.id;
      setView('newApplication', { wizardStep: 'resume_preview', activeApplicationId: app.id });
    };

    container.appendChild(div);
  });
}

function deleteApp(id) {
  // confirm() is blocked in artifact iframes — use inline modal instead
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `<div class="card" style="max-width:340px;width:100%">
    <h3 style="margin-bottom:8px">Delete application?</h3>
    <p style="font-size:14px;color:var(--text2);margin-bottom:20px">This cannot be undone.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" id="del-cancel">Cancel</button>
      <button class="btn btn-danger" id="del-confirm">Delete</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#del-cancel').onclick = () => modal.remove();
  modal.querySelector('#del-confirm').onclick = () => {
    modal.remove();
    deleteApplication(id);
    render();
  };
}

// ─── NEW APPLICATION WIZARD ───────────────────────────────────────────────────
function startNewApplication() {
  const user = activeUser();
  const app = {
    id: uid(), userId: user.id,
    jdUrl: '', pastedJD: '', jdText: '', positionName: '', company: '',
    notes: '', outputFormat: user.outputFormat || 'docx',
    resume: { status: 'pending', tokensUsed: 0, summaryText: '', files: [] },
    coverLetter: { status: 'none', tokensUsed: 0, summaryText: '', files: [] },
    createdAt: Date.now(),
  };
  saveApplication(app);
  // Fire-and-forget: guarantees a backend workspace exists before the wizard
  // reaches a step that needs one, without making the user wait here.
  ensureInstance(user);
  setView('newApplication', { activeApplicationId: app.id, wizardStep: 'A' });
}

function renderNewApplication() {
  const app = activeApp();
  if (!app) { setView('userHome'); return document.createElement('div'); }
  const user = activeUser();

  const wrap = document.createElement('div');
  wrap.className = 'wizard-box fade-in';

  const stepDefs = [
    { key: 'A', label: 'JD source' },
    { key: 'B', label: 'Resume' },
    { key: 'C', label: 'Notes' },
    { key: 'D', label: 'Analysis' },
    { key: 'E', label: 'Tailor' },
    { key: 'F', label: 'Finish' },
  ];
  const activeIdx = stepDefs.findIndex(s => s.key === AppState.wizardStep);

  // Step indicators (only for early steps)
  const earlySteps = ['A','B','C','D','E'];
  if (earlySteps.includes(AppState.wizardStep)) {
    const stepHtml = stepDefs.map((s, i) => {
      const isDone = i < activeIdx;
      const isActive = s.key === AppState.wizardStep;
      const cls = isDone ? 'step done' : isActive ? 'step active' : 'step';
      return `<div class="${cls}">
        <div class="step-dot">${isDone ? icons.check : i+1}</div>
        <div class="step-label">${s.label}</div>
      </div>`;
    }).join('');
    const stepDiv = document.createElement('div');
    stepDiv.className = 'steps';
    stepDiv.innerHTML = stepHtml;
    wrap.appendChild(stepDiv);
  }

  // Back button header
  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:20px';
  header.innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="setView('userHome')">${icons.back} Back</button>
    <h2 style="flex:1">${app.positionName ? `${app.positionName} at ${app.company}` : 'New application'}</h2>`;
  wrap.appendChild(header);

  // Route to step
  const stepFns = {
    A: renderStepA, B: renderStepB, C: renderStepC,
    D: renderStepD, D_gaps: renderStepDGaps,
    E: renderStepE, E_retailor: renderStepERetailor,
    resume_preview: renderResumePreview,
    F: renderStepF, F_cover: renderStepFCover,
  };
  const stepEl = (stepFns[AppState.wizardStep] || renderStepA)(app, user, wrap);
  if (stepEl) wrap.appendChild(stepEl);

  return wrap;
}

// Step B: Template + Info selectors (manage + paste/type for both)
function renderStepB(app, user) {
  if (!user.library) user.library = { templates: [], infos: [], coverLetters: [] };
  if (!user.library.templates) user.library.templates = [];
  if (!user.library.infos) user.library.infos = [];

  const templates = user.library.templates;
  const infos = user.library.infos;
  const activeTemplateId = app.overrideTemplateId || user.activeTemplateId || templates[0]?.id || null;
  const activeInfoId = app.overrideInfoId || user.activeInfoId || infos[0]?.id || null;
  const activeTemplate = templates.find(t => t.id === activeTemplateId) || null;
  const activeInfo = infos.find(i => i.id === activeInfoId) || null;

  // P1b (Round 7): collapse the common case — both fields already set from
  // profile creation (or a prior visit), nothing to change — into a compact
  // one-line-per-field summary with a "Change" disclosure, instead of
  // always showing six live controls (two cards, each with a list, an
  // upload zone, and a hidden paste sub-form) up front. Compact mode only
  // applies when the mandatory field (CV Info) is already satisfied — if
  // there's no info at all yet, there's a real decision to make, so the
  // full pickers always show (see `!activeInfo` below). Reachable via the
  // "Change" button, which sets AppState._stepBExpanded — a transient,
  // unpersisted UI flag (same pattern as the existing AppState._libTab),
  // reset back to compact whenever this step is left, so the next fresh
  // visit defaults to compact again.
  const expanded = !activeInfo || !!AppState._stepBExpanded;

  if (!expanded) {
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:4px">Resume setup</h3>
        <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Using the same template and CV info as your profile — nothing to change unless you want to.</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:10px;font-size:14px">
            <span class="badge badge-gray" style="font-size:10px;flex-shrink:0;white-space:nowrap">Template · optional</span>
            <span>${activeTemplate ? escAttr(activeTemplate.name) : 'None set'}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;font-size:14px">
            <span class="badge badge-blue" style="font-size:10px;flex-shrink:0;white-space:nowrap">Info · required</span>
            <span>${escAttr(activeInfo.name)}</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-ghost" id="step-b-back">${icons.back} Back</button>
          <button class="btn btn-ghost" id="step-b-change">Change</button>
          <button class="btn btn-primary" id="step-b-next-compact">Next ${icons.arrow}</button>
        </div>
      </div>`;
    div.querySelector('#step-b-back').onclick = () => { AppState._stepBExpanded = false; AppState.wizardStep = 'A'; render(); };
    div.querySelector('#step-b-change').onclick = () => { AppState._stepBExpanded = true; render(); };
    div.querySelector('#step-b-next-compact').onclick = () => {
      // Nothing changed from the active library defaults — persist the same
      // override shape the expanded path's Next button writes below, so
      // Step D/E/F's resolveProfilePayload() reads identically either way.
      app.overrideTemplateId = activeTemplateId;
      app.overrideTemplateB64 = activeTemplate?.b64 || null;
      app.overrideTemplateText = activeTemplate?.textContent || null;
      app.overrideInfoId = activeInfoId;
      app.overrideInfoSections = activeInfo?.mappedSections || null;
      app.overrideInfoRawText = activeInfo?.rawText || null;
      AppState._stepBExpanded = false;
      saveState();
      saveApplication(app);
      AppState.wizardStep = 'C'; render();
    };
    return div;
  }

  function makeOptions(items, activeId, idPrefix) {
    if (items.length === 0) {
      return `<p style="font-size:13px;color:var(--text3);padding:6px 0">None yet — upload or paste below.</p>`;
    }
    return items.map(item => `
      <div class="lib-item ${item.id === activeId ? 'lib-active' : ''}" style="cursor:pointer;${item.id === activeId ? 'border-color:var(--accent-text);background:var(--accent-bg)' : ''}" data-id="${item.id}" data-prefix="${idPrefix}">
        <div class="lib-name" style="flex:1;font-size:13px">${item.name}${item.source === 'paste' || item.source === 'typed' ? ' <span class="badge badge-gray" style="font-size:10px">' + item.source + '</span>' : ''}</div>
        <div style="display:flex;align-items:center;gap:6px">
          ${item.id === activeId ? `<span class="badge badge-blue" style="font-size:11px">Selected</span>` : ''}
          <button type="button" class="btn btn-ghost btn-sm lib-del" data-id="${item.id}" data-prefix="${idPrefix}" title="Remove" aria-label="Remove ${escAttr(item.name)}" style="padding:2px 6px;color:var(--danger)">${icons.trash || '×'}</button>
        </div>
      </div>`).join('');
  }

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin-bottom:4px">CV Template <span class="badge badge-gray" style="font-size:10px;font-weight:500;vertical-align:middle">optional</span></h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Visual shell for this application — upload a .docx/.pdf/.tex, or paste/type a text outline. Select one from your library or add new.</p>
      <div id="tmpl-list">${makeOptions(templates, activeTemplateId, 'tmpl')}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">
          ${icons.plus} Upload template
          <input type="file" id="tmpl-override-file" accept=".docx,.pdf,.tex,.txt,.md" style="display:none">
        </label>
        <button class="btn btn-ghost btn-sm" id="tmpl-paste-btn">${icons.plus} Paste / type template</button>
      </div>
      <div id="tmpl-paste-area" style="display:none;margin-top:10px">
        <div class="field-group">
          <label for="tmpl-paste-name">Template name</label>
          <input id="tmpl-paste-name" type="text" placeholder="e.g. Two-column banking layout notes" maxlength="80">
        </div>
        <div class="field-group">
          <label for="tmpl-paste-input">Template content</label>
          <textarea id="tmpl-paste-input" rows="8" placeholder="Paste or type your CV template here — layout notes, section order, LaTeX skeleton, markdown structure, whatever you want the tailor step to follow…"></textarea>
          <div class="hint">Saved to your library for this and future applications.</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" id="tmpl-paste-cancel">Cancel</button>
          <button class="btn btn-primary btn-sm" id="tmpl-paste-save">Save & use template</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin-bottom:4px">CV Info <span class="badge badge-blue" style="font-size:10px;font-weight:500;vertical-align:middle">required</span></h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Career content used for fit evaluation and tailoring. This is what gets written into the backend profile — without it, evaluate will refuse.</p>
      <div id="info-list">${makeOptions(infos, activeInfoId, 'info')}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">
          ${icons.plus} Upload new info
          <input type="file" id="info-override-file" accept=".docx,.pdf,.txt,.md" style="display:none">
        </label>
        <button class="btn btn-ghost btn-sm" id="info-paste-btn">${icons.plus} Paste / type info</button>
      </div>
      <div id="info-paste-area" style="display:none;margin-top:10px">
        <textarea id="info-paste-input" rows="8" placeholder="Paste or type your CV content here — jobs, skills, education, projects…"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-ghost btn-sm" id="info-paste-cancel">Cancel</button>
          <button class="btn btn-primary btn-sm" id="info-paste-save">
            <span id="info-paste-spin" style="display:none" class="spin"></span> Map & use
          </button>
        </div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-ghost" onclick="AppState._stepBExpanded=false;AppState.wizardStep='A';render()">${icons.back} Back</button>
      <button class="btn btn-primary" id="step-b-next">Next ${icons.arrow}</button>
    </div>`;

  let selTemplateId = activeTemplateId;
  let selInfoId = activeInfoId;

  function rebindList(prefix) {
    div.querySelectorAll(`.lib-item[data-prefix="${prefix}"]`).forEach(el => {
      el.style.cursor = 'pointer';
      el.onclick = (ev) => {
        if (ev.target.closest('.lib-del')) return;
        const id = el.dataset.id;
        if (prefix === 'tmpl') {
          selTemplateId = id;
          div.querySelector('#tmpl-list').innerHTML = makeOptions(user.library.templates, selTemplateId, 'tmpl');
        } else {
          selInfoId = id;
          div.querySelector('#info-list').innerHTML = makeOptions(user.library.infos, selInfoId, 'info');
        }
        rebindList(prefix);
      };
    });
    div.querySelectorAll(`.lib-del[data-prefix="${prefix}"]`).forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const id = btn.dataset.id;
        if (prefix === 'tmpl') {
          user.library.templates = user.library.templates.filter(t => t.id !== id);
          if (user.activeTemplateId === id) user.activeTemplateId = user.library.templates[0]?.id || null;
          if (selTemplateId === id) selTemplateId = user.library.templates[0]?.id || null;
          saveState();
          div.querySelector('#tmpl-list').innerHTML = makeOptions(user.library.templates, selTemplateId, 'tmpl');
          rebindList('tmpl');
          notify('Template removed');
        } else {
          user.library.infos = user.library.infos.filter(i => i.id !== id);
          if (user.activeInfoId === id) user.activeInfoId = user.library.infos[0]?.id || null;
          if (selInfoId === id) selInfoId = user.library.infos[0]?.id || null;
          saveState();
          div.querySelector('#info-list').innerHTML = makeOptions(user.library.infos, selInfoId, 'info');
          rebindList('info');
          notify('CV info removed');
        }
      };
    });
  }
  rebindList('tmpl');
  rebindList('info');

  // Upload new template
  div.querySelector('#tmpl-override-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const b64 = await fileToB64(f);
    const newId = uid();
    const type = f.name.endsWith('.pdf') ? 'pdf' : f.name.endsWith('.tex') ? 'tex' : f.name.endsWith('.md') ? 'md' : f.name.endsWith('.txt') ? 'txt' : 'docx';
    let textContent = null;
    if (type === 'txt' || type === 'md' || type === 'tex') {
      try { textContent = await f.text(); } catch { /* keep null */ }
    }
    user.library.templates.push({ id: newId, name: f.name, b64, type, textContent, source: 'upload', addedAt: Date.now() });
    user.activeTemplateId = newId;
    saveState();
    selTemplateId = newId;
    notify(`Template "${f.name}" added`);
    div.querySelector('#tmpl-list').innerHTML = makeOptions(user.library.templates, selTemplateId, 'tmpl');
    rebindList('tmpl');
  };

  // Paste / type template
  div.querySelector('#tmpl-paste-btn').onclick = () => { div.querySelector('#tmpl-paste-area').style.display = ''; };
  div.querySelector('#tmpl-paste-cancel').onclick = () => { div.querySelector('#tmpl-paste-area').style.display = 'none'; };
  div.querySelector('#tmpl-paste-save').onclick = () => {
    const text = div.querySelector('#tmpl-paste-input').value.trim();
    if (!text) { notify('Paste or type some template content first', 'error'); return; }
    const name = div.querySelector('#tmpl-paste-name').value.trim() || `Typed template ${fmtDate(Date.now())}`;
    const newId = uid();
    user.library.templates.push({
      id: newId,
      name,
      b64: null,
      type: 'text',
      textContent: text,
      source: 'typed',
      addedAt: Date.now(),
    });
    user.activeTemplateId = newId;
    saveState();
    selTemplateId = newId;
    div.querySelector('#tmpl-paste-area').style.display = 'none';
    div.querySelector('#tmpl-paste-input').value = '';
    div.querySelector('#tmpl-paste-name').value = '';
    notify(`Template "${name}" saved`);
    div.querySelector('#tmpl-list').innerHTML = makeOptions(user.library.templates, selTemplateId, 'tmpl');
    rebindList('tmpl');
  };

  // Upload new info
  div.querySelector('#info-override-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const statusDiv = document.createElement('div');
    statusDiv.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-top:8px';
    statusDiv.innerHTML = '<div class="spin"></div> Mapping sections…';
    div.querySelector('#info-list').after(statusDiv);
    try {
      let rawText;
      if (f.name.endsWith('.pdf')) rawText = await extractPdfText(f);
      else if (f.name.endsWith('.docx')) rawText = await extractDocxText(f);
      else rawText = await f.text();
      const { sections } = await runMapCvTask(rawText);
      const newId = uid();
      user.library.infos.push({ id: newId, name: f.name, source: 'upload', mappedSections: sections, rawText, addedAt: Date.now() });
      user.activeInfoId = newId;
      saveState();
      selInfoId = newId;
      statusDiv.remove();
      notify(`CV info "${f.name}" mapped and added`);
      div.querySelector('#info-list').innerHTML = makeOptions(user.library.infos, selInfoId, 'info');
      rebindList('info');
    } catch (err) { statusDiv.textContent = `Error: ${err.message}`; statusDiv.style.color = 'var(--danger)'; }
  };

  // Paste / type info
  div.querySelector('#info-paste-btn').onclick = () => { div.querySelector('#info-paste-area').style.display = ''; };
  div.querySelector('#info-paste-cancel').onclick = () => { div.querySelector('#info-paste-area').style.display = 'none'; };
  div.querySelector('#info-paste-save').onclick = async () => {
    const text = div.querySelector('#info-paste-input').value.trim();
    if (!text) return;
    const spin = div.querySelector('#info-paste-spin');
    spin.style.display = '';
    div.querySelector('#info-paste-save').disabled = true;
    try {
      const { sections } = await runMapCvTask(text);
      const newId = uid();
      user.library.infos.push({ id: newId, name: `Pasted info ${fmtDate(Date.now())}`, source: 'paste', mappedSections: sections, rawText: text, addedAt: Date.now() });
      user.activeInfoId = newId;
      saveState();
      selInfoId = newId;
      div.querySelector('#info-paste-area').style.display = 'none';
      notify('CV info mapped and added');
      div.querySelector('#info-list').innerHTML = makeOptions(user.library.infos, selInfoId, 'info');
      rebindList('info');
    } catch (err) { notify(`Error: ${err.message}`, 'error'); }
    spin.style.display = 'none';
    div.querySelector('#info-paste-save').disabled = false;
  };

  div.querySelector('#step-b-next').onclick = () => {
    const tmpl = user.library.templates.find(t => t.id === selTemplateId) || null;
    const info = user.library.infos.find(i => i.id === selInfoId) || null;
    if (!info || !(info.mappedSections || info.rawText)) {
      notify('Add CV Info first (upload or paste) — evaluate needs real profile content', 'error');
      return;
    }
    app.overrideTemplateId = selTemplateId;
    app.overrideTemplateB64 = tmpl?.b64 || null;
    app.overrideTemplateText = tmpl?.textContent || null;
    app.overrideInfoId = selInfoId;
    app.overrideInfoSections = info?.mappedSections || null;
    app.overrideInfoRawText = info?.rawText || null;
    if (selTemplateId) user.activeTemplateId = selTemplateId;
    if (selInfoId) user.activeInfoId = selInfoId;
    AppState._stepBExpanded = false;
    saveState();
    saveApplication(app);
    AppState.wizardStep = 'C'; render();
  };
  return div;
}

// Step C: Notes + Run
function renderStepC(app) {
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:4px">Notes for the AI</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Optional guidance — steer tone, highlight specific experience, mention anything special.</p>
      <div class="field-group">
        <textarea id="notes-input" rows="4" placeholder="e.g. 'Emphasise my data pipeline work. The role values Python over SQL so lead with that.'">${app.notes || ''}</textarea>
      </div>
      <div class="field-group">
        <label>Output format</label>
        <fieldset class="btn-group" style="border:none;padding:0;margin-inline:0;min-width:0">
          <legend class="sr-only">Output format</legend>
          <label class="radio-card ${app.outputFormat !== 'latex' ? 'selected' : ''}" id="format-docx">
            <input type="radio" name="app-output-format" value="docx" class="sr-only" ${app.outputFormat !== 'latex' ? 'checked' : ''}>
            <h4>docx</h4><p>Fast, no LaTeX toolchain needed</p>
          </label>
          <label class="radio-card ${app.outputFormat === 'latex' ? 'selected' : ''}" id="format-latex">
            <input type="radio" name="app-output-format" value="latex" class="sr-only" ${app.outputFormat === 'latex' ? 'checked' : ''}>
            <h4>LaTeX / PDF</h4><p>No AI-authorship metadata in the file</p>
          </label>
        </fieldset>
      </div>
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-ghost" onclick="AppState._stepBExpanded=false;AppState.wizardStep='B';render()">${icons.back} Back</button>
        <button class="btn btn-primary" id="step-c-run">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Run analysis
        </button>
      </div>
    </div>`;

  div.querySelectorAll('input[name="app-output-format"]').forEach(r => {
    r.addEventListener('change', () => {

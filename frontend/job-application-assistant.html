    saveApplication(app);
    AppState.wizardStep = 'D'; render();
  };
  return div;
}

// Step D: Run extract + gap analysis (per-section pass)
// P0 (Round 7): simulated staged narrative for the "evaluating fit" phase —
// the longer of Step D's two AI waits. See the WAIT NARRATIVE section's
// comment for what this is/isn't (client-side elapsed-time narrative, not
// literal backend phase reporting). JD extraction's own status text stays
// driven by the real onStatus() phase callback below, since that IS known.
const EVAL_STAGES = [
  [0, 'Reading your profile…'],
  [10, 'Comparing against the job posting…'],
  [25, 'Scoring fit…'],
  [45, 'Writing up the evaluation…'],
];

function renderStepD(app, user) {
  const div = document.createElement('div');

  div.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:16px">Analysing job description</h3>
      <div id="d-status" style="display:flex;flex-direction:column;gap:12px" role="status" aria-live="polite">
        <div id="status-jd" style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2)">
          <div class="spin"></div> <span id="status-jd-text">Extracting job description…</span> <span id="status-jd-elapsed" class="hint" aria-hidden="true"></span>
        </div>
        <div id="status-eval" style="display:none;align-items:center;gap:10px;font-size:14px;color:var(--text2)">
          <div class="spin"></div> <span id="status-eval-text">Reading your profile…</span> <span id="status-eval-elapsed" class="hint" aria-hidden="true"></span>
        </div>
      </div>
      <div id="d-cancel-row" style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn btn-ghost btn-sm" id="d-cancel">Cancel</button>
        <span class="hint">Stops waiting and takes you back to Notes — the AI run may still finish in the background.</span>
      </div>
      <div id="d-result"></div>
      <div id="d-error" role="alert" style="display:none;margin-top:12px;padding:12px;background:var(--danger-bg);color:var(--danger-text);border-radius:var(--radius);font-size:13px"></div>
    </div>`;

  async function run() {
    // P0 (Round 7): a real AbortController wired to a real Cancel button —
    // aborting it aborts whichever fetch is actually in flight (JD
    // scrape/extract, or the /v1/evaluate call), not just the UI's
    // attention to it. Honest about scope: this stops the client from
    // waiting, it does not guarantee the backend's agent run stops
    // server-side (this backend has no cancellation-token mechanism) — the
    // Cancel button's own copy says exactly that, not more.
    const controller = new AbortController();
    let evalStartedAt = null;
    const stopTicker = startElapsedTicker(sec => {
      const jdElapsedEl = div.querySelector('#status-jd-elapsed');
      if (jdElapsedEl) jdElapsedEl.textContent = `${sec}s`;
      if (evalStartedAt != null) {
        const evalSec = Math.floor((Date.now() - evalStartedAt) / 1000);
        const evalTextEl = div.querySelector('#status-eval-text');
        const evalElapsedEl = div.querySelector('#status-eval-elapsed');
        if (evalTextEl) evalTextEl.textContent = stageText(EVAL_STAGES, evalSec);
        if (evalElapsedEl) evalElapsedEl.textContent = `${evalSec}s`;
      }
    });
    const cancelBtn = div.querySelector('#d-cancel');
    if (cancelBtn) cancelBtn.onclick = () => {
      controller.abort();
      stopTicker();
      AppState.wizardStep = 'C';
      render();
    };

    try {
      assertAiCallsEnabled(); // Round 9: short-circuit before JD extraction / /v1/evaluate if paused
      // JD extraction (with optional scrape) is kept as a hermetic utility
      // call — /v1/evaluate needs structured company/role for its request
      // body, and the app list needs them for labels; there's no other
      // structured source for these once gap analysis is delegated to the
      // engine's skill instead of being reimplemented client-side.
      const jdInput = app.jdUrl || app.pastedJD || '';

      const onStatus = (phase) => {
        const textEl = div.querySelector('#status-jd-text');
        if (!textEl) return;
        if (phase === 'scraping') textEl.textContent = 'Fetching page from URL…';
        else if (phase === 'extracting') textEl.textContent = 'Extracting job description…';
      };

      const { extracted, tokens: t1, scraped } = await runJdExtract(jdInput, onStatus, controller.signal);

      if (extracted.jdText === 'URL_UNFETCHABLE') {
        stopTicker();
        app._jdFetchFailed = true;
        saveApplication(app);
        AppState.wizardStep = 'A';
        render();
        setTimeout(() => {
          const el = document.querySelector('#jd-fetch-error');
          if (el) el.style.display = '';
        }, 50);
        return;
      }

      app.positionName = extracted.positionName;
      app.company = extracted.company;
      app.jdText = extracted.jdText;
      app.thinJd = extracted.thinJd;
      saveApplication(app);

      const scrapeNote = scraped ? ' <span class="badge badge-green" style="font-size:11px">scraped</span>' : '';
      const jdEl = div.querySelector('#status-jd');
      if (jdEl) jdEl.innerHTML = `<span style="color:var(--success)">✓</span> JD extracted — <strong>${app.positionName}</strong> at <strong>${app.company}</strong>${scrapeNote} <span class="token-pill">${fmtTokens(t1)}</span>`;

      const evalEl = div.querySelector('#status-eval');
      if (evalEl) evalEl.style.display = 'flex';
      evalStartedAt = Date.now();

      // Real fit evaluation, via the engine's job-application-assistant skill
            // (04-job-evaluation.md) running in-repo against this user's profile.
            const instanceId = await ensureInstance(user);
            if (!instanceId) throw new Error('No workspace available — start the local backend and try again.');

            // Re-sync the instance's profile with whatever's actually active for
            // THIS application — a per-application override picked in Step B, or
            // the user's current default if none was picked — since ensureInstance
            // only wrote it once, at first provision. Always pass rawText so the
            // backend never ends up name-only with [YOUR_…] placeholders.
            const payload = resolveProfilePayload(user, app);
            if (!payload.sections && !payload.rawText) {
              throw new Error('No CV Info synced for this profile. Go back to Step B and upload or paste your CV content.');
            }
            await syncProfileSections(user, payload.sections, payload.rawText);

            const resp = await backendFetch(`${BACKEND_BASE}/v1/evaluate`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ instanceId, modelId: AppState.settings.modelId, jobPosting: app.jdText }),
              signal: controller.signal,
            });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Evaluation failed (${resp.status})`);
      }
      const data = await resp.json();
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const tokens = (data.usage?.input_tokens || 0) + (data.usage?.output_tokens || 0);
      // Round 6: /v1/evaluate now also returns a structured "gaps" array
      // alongside the unchanged markdown text (content[0].text is still the
      // exact same report as before — this is purely additive). Coerce to
      // an array defensively in case an older/misbehaving backend omits it.
      const gaps = Array.isArray(data.gaps) ? data.gaps : [];

      app.evaluation = { text, tokens, gaps };
      saveApplication(app);

      stopTicker();
      if (evalEl) evalEl.innerHTML = `<span style="color:var(--success)">✓</span> Evaluation complete <span class="token-pill">${fmtTokens(tokens)}</span>`;
      const cancelRow = div.querySelector('#d-cancel-row');
      if (cancelRow) cancelRow.style.display = 'none';

      // This can be a substantial report — show it and let the user decide
      // whether to proceed, rather than auto-advancing past it unread.
      const resultEl = div.querySelector('#d-result');
      if (resultEl) {
        resultEl.innerHTML = `
          <div class="md-report" style="max-height:480px;overflow-y:auto;margin-top:16px;padding:4px">${renderMarkdown(text)}</div>
          <div class="btn-group" style="margin-top:16px">
            <button class="btn btn-ghost" onclick="AppState.wizardStep='C';render()">${icons.back} Back</button>
            <button class="btn btn-primary" id="d-proceed">Proceed to tailoring ${icons.arrow}</button>
          </div>`;
        resultEl.querySelector('#d-proceed').onclick = () => {
          // Round 6: only detour through the gap-closing discussion if the
          // evaluation actually found real gaps to discuss — an empty
          // array proceeds straight to tailoring exactly as before, so
          // there's no pointless empty step for a clean-fit evaluation.
          AppState.wizardStep = gaps.length > 0 ? 'D_gaps' : 'E';
          render();
        };
      }

    } catch (e) {
      stopTicker();
      if (e && e.name === 'AbortError') return; // Cancel already navigated away
      const errEl = div.querySelector('#d-error');
      if (errEl) { errEl.textContent = `Error: ${e.message}`; errEl.style.display = ''; }
      const retry = document.createElement('button');
      retry.className = 'btn btn-secondary';
      retry.style.marginTop = '12px';
      retry.textContent = 'Retry';
      retry.onclick = () => { errEl.style.display = 'none'; retry.remove(); run(); };
      errEl.after(retry);
    }
  }

  requestAnimationFrame(run);
  return div;
}

// ─── GAP-CLOSING DISCUSSION (Round 6) ──────────────────────────────────────
// Reuses the P4 guided-Q&A stepper's interaction pattern (own Previous/Skip/
// Next per item, "finish early" escape hatch) but for the structured "gaps"
// array /v1/evaluate now returns alongside its unchanged markdown report.
// Owner's explicit choice (via scoping question): structured per-gap
// choices, not free-form chat, and the resolved decisions feed into the
// EXISTING app.notes field — no new data model, no change needed to the
// tailor/cover-letter request shape, which already reads notes unmodified.
// #d-proceed above only routes here when app.evaluation.gaps is non-empty;
// otherwise it goes straight to 'E', same as before this feature existed.
function renderStepDGaps(app, user) {
  const div = document.createElement('div');
  const gaps = app.evaluation?.gaps || [];

  // gapChoices[i] holds the chosen strategy text OR a typed custom
  // approach for gap i; absent/empty means "skipped" — same "skipped ==
  // omitted" contract buildQaRawText() established for P4, applied here
  // in buildGapDecisionsText() below.
  let state = { gapStep: 0, gapChoices: {} };

  function buildGapDecisionsText() {
    return gaps
      .map((g, i) => ({ gap: (g && g.gap) || '', val: (state.gapChoices[i] || '').trim() }))
      .filter(({ val }) => val)
      .map(({ gap, val }) => `Gap: ${gap}\nChosen approach: ${val}`)
      .join('\n\n');
  }

  function finish() {
    const block = buildGapDecisionsText();
    // Same append-pattern the "Re-tailor with feedback" flow already uses
    // for app.notes (renderStepERetailor, below) — a labeled block appended
    // to whatever notes already exist, nothing rewritten or removed.
    if (block) {
      app.notes = (app.notes ? app.notes + '\n\nGAP-CLOSING DECISIONS:\n' : 'GAP-CLOSING DECISIONS:\n') + block;
    }
    saveApplication(app);
    AppState.wizardStep = 'E';
    render();
  }

  function advance() {
    if (state.gapStep < gaps.length - 1) { state.gapStep++; localRender(); }
    else finish();
  }

  function localRender() {
    const i = Math.min(state.gapStep, Math.max(0, gaps.length - 1));
    const g = gaps[i] || {};
    const strategies = Array.isArray(g.strategies) ? g.strategies : [];
    const chosen = state.gapChoices[i] || '';
    const chosenStrategyIdx = strategies.findIndex(s => s === chosen);

    div.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-bottom:10px">Closing the gap — ${i + 1} of ${gaps.length}</div>
        <p style="font-weight:600;margin-bottom:4px">${escAttr(g.gap || '')}</p>
        <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Pick a direction below, or write your own — whatever you choose here gets passed to the tailoring step as guidance.</p>
        <fieldset style="border:none;padding:0;margin-inline:0;min-width:0;display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
          <legend class="sr-only">Strategy for this gap</legend>
          ${strategies.map((s, si) => `
            <label class="radio-card ${si === chosenStrategyIdx ? 'selected' : ''}" data-strategy-idx="${si}">
              <input type="radio" name="gap-strategy-${i}" value="${si}" class="sr-only" ${si === chosenStrategyIdx ? 'checked' : ''}>
              <h4 style="font-weight:500">${escAttr(s)}</h4>
            </label>`).join('')}
        </fieldset>
        <div class="field-group">
          <label for="gap-custom">Or describe your own approach</label>
          <textarea id="gap-custom" rows="2" placeholder="e.g. I'll address this directly in the cover letter.">${chosenStrategyIdx === -1 ? escAttr(chosen) : ''}</textarea>
        </div>
        <div class="btn-group">
          ${i > 0 ? `<button class="btn btn-ghost" id="gap-prev">${icons.back} Previous</button>` : ''}
          <button class="btn btn-ghost" id="gap-skip">Skip this gap</button>
          <button class="btn btn-primary" id="gap-next">${i === gaps.length - 1 ? 'Finish' : `Next ${icons.arrow}`}</button>
        </div>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn btn-ghost btn-sm" id="gap-skip-all">Skip this discussion entirely, continue to tailoring</button>
        </div>
      </div>`;

    // P1c (Round 7): real radio inputs now (see markup above) — listen for
    // 'change' on the inputs so keyboard arrow-key selection works, not
    // just a mouse click on the old bare div.
    div.querySelectorAll(`input[name="gap-strategy-${i}"]`).forEach(r => {
      r.addEventListener('change', () => {
        if (!r.checked) return;
        state.gapChoices[i] = strategies[+r.value];
        // F1 (Round 7 follow-up): same localRender()-destroys-focus fix as
        // the info-mode/new-output-format groups in renderInfoStep — this
        // group's own localRender() (above) also replaces div's innerHTML.
        const name = r.name, value = r.value;
        localRender();
        div.querySelector(`input[name="${name}"][value="${value}"]`)?.focus();
      });
    });
    const customEl = div.querySelector('#gap-custom');
    if (customEl) customEl.oninput = e => {
      state.gapChoices[i] = e.target.value;
      // Direct DOM toggle rather than a full re-render, matching P2-1's
      // precedent for text inputs — avoids dropping focus/cursor on every
      // keystroke, while still deselecting a previously-picked strategy
      // card (and unchecking its now-real radio input) the instant the
      // user starts typing their own answer instead.
      div.querySelectorAll(`input[name="gap-strategy-${i}"]`).forEach(r => { r.checked = false; });
      div.querySelectorAll('[data-strategy-idx]').forEach(b => b.classList.remove('selected'));
    };
    const prevBtn = div.querySelector('#gap-prev');
    if (prevBtn) prevBtn.onclick = () => { state.gapStep = Math.max(0, state.gapStep - 1); localRender(); };
    // Skip must actually clear this gap's choice before advancing, not just
    // move past it with a leftover selection — same fix P9 made for the
    // guided Q&A intake's "Skip this question".
    div.querySelector('#gap-skip').onclick = () => { state.gapChoices[i] = ''; advance(); };
    div.querySelector('#gap-next').onclick = advance;
    div.querySelector('#gap-skip-all').onclick = finish;
  }

  if (gaps.length === 0) {
    // Defensive only — #d-proceed's handler never routes here when gaps is
    // empty, so this branch is not expected to be reached in practice.
    // Deferred via requestAnimationFrame (same pattern renderStepD/
    // renderStepE already use for their own post-construction work) so
    // finish()'s render() call runs AFTER this function has returned its
    // div to the caller, instead of re-entering the global render()
    // synchronously in the middle of the current render pass.
    requestAnimationFrame(finish);
  } else {
    localRender();
  }
  return div;
}

// Step E: Tailor per section
// P0 (Round 7): simulated staged narrative for the tailoring wait — see the
// WAIT NARRATIVE section's comment for what this is/isn't.
const TAILOR_STAGES = [
  [0, 'Reading your profile and the job posting…'],
  [15, 'Reworking your summary and skills…'],
  [35, 'Adjusting experience bullets to match the role…'],
  [60, 'Finalising and checking honesty flags…'],
];

function renderStepE(app, user) {
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:4px">Tailoring your resume</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">This runs the real CV-tailoring skill against your profile — it can take a couple of minutes.</p>
      <div id="tailor-status" style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text2)" role="status" aria-live="polite">
        <div class="spin"></div> <span id="tailor-status-text">Reading your profile and the job posting…</span> <span id="tailor-status-elapsed" class="hint" aria-hidden="true"></span>
      </div>
      <div id="tailor-cancel-row" style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn btn-ghost btn-sm" id="tailor-cancel">Cancel</button>
        <span class="hint">Stops waiting and takes you back — the AI run may still finish in the background.</span>
      </div>
      <div id="tailor-error" role="alert" style="display:none;color:var(--danger);font-size:13px;margin-top:8px"></div>
    </div>`;

  async function run() {
      // P0 (Round 7): capture what step/application this run started
      // against, so the setTimeout below can check the user is still where
      // this run began before applying its effect — the completion timer
      // used to fire unconditionally, which could teleport the user into
      // resume_preview after they'd already navigated elsewhere mid-wait.
      const startedStep = AppState.wizardStep;
      const startedAppId = AppState.activeApplicationId;

      // Real Cancel — see renderStepD's identical comment for the honest
      // scope (stops the client wait, doesn't guarantee the backend run
      // stops). Cancel target: if a resume already exists (this is a
      // re-tailor), go back to it rather than losing sight of it; otherwise
      // prefer the gap-closing screen if there is one (pure client-side,
      // re-reads the already-saved evaluation, triggers no new AI call) so
      // cancelling a first-time tailor doesn't also silently cost a second,
      // unrequested AI call — falling back to Notes only when there's
      // nothing safe to show without re-running something.
      const controller = new AbortController();
      const stopTicker = startElapsedTicker(sec => {
        const t = div.querySelector('#tailor-status-text');
        const e = div.querySelector('#tailor-status-elapsed');
        if (t) t.textContent = stageText(TAILOR_STAGES, sec);
        if (e) e.textContent = `${sec}s`;
      });
      const cancelBtn = div.querySelector('#tailor-cancel');
      if (cancelBtn) cancelBtn.onclick = () => {
        controller.abort();
        stopTicker();
        AppState.wizardStep = app.resume?.status === 'done'
          ? 'resume_preview'
          : ((app.evaluation?.gaps || []).length > 0 ? 'D_gaps' : 'C');
        render();
      };

      try {
        assertAiCallsEnabled(); // Round 9: short-circuit before /v1/tailor if paused
        const instanceId = await ensureInstance(user);
        if (!instanceId) throw new Error('No workspace available — start the local backend and try again.');

        // Re-sync in case CV Info was swapped since Step D last synced it, or
        // this instance is shared across multiple applications for this user.
        const payload = resolveProfilePayload(user, app);
        await syncProfileSections(user, payload.sections, payload.rawText);

        const resp = await backendFetch(`${BACKEND_BASE}/v1/tailor`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instanceId,
            modelId: AppState.settings.modelId,
            jobPosting: app.jdText,
            company: app.company,
            role: app.positionName,
            outputFormat: app.outputFormat || user.outputFormat || 'docx',
            notes: app.notes,
          }),
          signal: controller.signal,
        });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Tailoring failed (${resp.status})`);
      }
      const data = await resp.json();
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const tokens = (data.usage?.input_tokens || 0) + (data.usage?.output_tokens || 0);
      const files = realArtifacts(data.files);
      // P1a (Round 7): the backend's tailor prompt already classifies
      // content into source-verified / plausibly-transferable / fabricated
      // (fabricated is never included) — /v1/tailor now additionally
      // returns a short structured "transparency" list of the notably
      // inferred-not-verified items, alongside the unchanged summary text.
      // Coerce to an array defensively in case an older/misbehaving
      // backend omits it, same pattern as Round 6's "gaps".
      const transparency = Array.isArray(data.transparency) ? data.transparency : [];

      app.resume = {
        status: 'done',
        tokensUsed: (app.resume?.tokensUsed || 0) + tokens,
        summaryText: text,
        files,
        transparency,
      };
      saveApplication(app);

      stopTicker();
      const statusEl = div.querySelector('#tailor-status');
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--success)">✓</span> Complete! <span class="token-pill">${fmtTokens(tokens)}</span>`;
      const cancelRow = div.querySelector('#tailor-cancel-row');
      if (cancelRow) cancelRow.style.display = 'none';
      setTimeout(() => {
        if (AppState.wizardStep === startedStep && AppState.activeApplicationId === startedAppId) {
          AppState.wizardStep = 'resume_preview'; render();
        }
      }, 500);
    } catch (e) {
      stopTicker();
      if (e && e.name === 'AbortError') return; // Cancel already navigated away
      const errEl = div.querySelector('#tailor-error');
      if (errEl) { errEl.textContent = `Error: ${e.message}`; errEl.style.display = ''; }
      const retry = document.createElement('button');
      retry.className = 'btn btn-secondary';
      retry.style.marginTop = '8px';
      retry.textContent = 'Retry';
      retry.onclick = () => { errEl.style.display = 'none'; retry.remove(); run(); };
      errEl.after(retry);
    }
  }

  requestAnimationFrame(run);
  return div;
}

// Step F: Cover letter
function renderStepF(app, user) {
  const coverLetters = user?.library?.coverLetters || [];
  const div = document.createElement('div');

  const clOptions = coverLetters.length > 0
    ? coverLetters.map((cl, i) => `
        <div class="lib-item" style="cursor:pointer" data-cl-idx="${i}">
          <div class="lib-name" style="flex:1">${cl.name}</div>
          <div class="lib-date">${fmtDate(cl.addedAt)}</div>
        </div>`).join('')
    : `<p style="font-size:13px;color:var(--text3);padding:6px 0">No templates saved — use the Library to add one, or write from scratch below.</p>`;

  div.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:4px">Cover letter</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Pick a template from your library to tailor, or write from scratch.</p>

      ${coverLetters.length > 0 ? `
      <div style="margin-bottom:16px">
        <div style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Your templates</div>
        <div id="cl-pick-list">${clOptions}</div>
      </div>
      <div class="divider"></div>` : ''}

      <div class="btn-group" style="margin-top:${coverLetters.length > 0 ? '16px' : '0'}">
        <button class="btn btn-primary" id="cover-scratch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          Write from scratch
        </button>
        <button class="btn btn-secondary" id="cover-skip">Skip for now</button>
      </div>
    </div>`;

  // Click a template
  div.querySelectorAll('[data-cl-idx]').forEach(el => {
    el.onclick = () => {
      const cl = coverLetters[parseInt(el.dataset.clIdx)];
      if (!cl?.b64) { notify('Template file not available — re-upload it in Library', 'error'); return; }
      // Decode b64 to text
      try {
        const bytes = b64ToBytes(cl.b64);
        const ext = cl.name.split('.').pop().toLowerCase();
        if (ext === 'txt') {
          const text = new TextDecoder().decode(bytes);
          app._coverTemplateText = text;
          app._coverTemplateName = cl.name;
        } else if (ext === 'docx') {
          // Use mammoth to extract text from docx bytes
          mammoth.extractRawText({ arrayBuffer: bytes }).then(result => {
            app._coverTemplateText = result.value;
            app._coverTemplateName = cl.name;
            saveApplication(app);
            AppState.wizardStep = 'F_cover'; render();
          });
          return;
        } else {
          // pdf or other — treat as text
          app._coverTemplateText = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          app._coverTemplateName = cl.name;
        }
        saveApplication(app);
        AppState.wizardStep = 'F_cover'; render();
      } catch(e) { notify('Could not read template: ' + e.message, 'error'); }
    };
  });

  div.querySelector('#cover-scratch').onclick = () => {
    app._coverTemplateText = '';
    app._coverTemplateName = '';
    saveApplication(app);
    AppState.wizardStep = 'F_cover'; render();
  };
  div.querySelector('#cover-skip').onclick = () => setView('userHome');
  return div;
}

function renderStepFCover(app, user) {

  div.innerHTML = `

  async function run() {
      // Real Cancel — same honest scope as Step D/E. Step F (the template

      const controller = new AbortController();
      const stopTicker = startElapsedTicker(sec => {

        if (t) t.textContent = stageText(COVER_STAGES, sec);

        const instanceId = await ensureInstance(user);
        if (!instanceId) throw new Error('No workspace available — start the local backend and try again.');

        // Re-sync in case CV Info was swapped since Step D last synced it, or
        // this instance is shared across multiple applications for this user.
        const payload = resolveProfilePayload(user, app);
        await syncProfileSections(user, payload.sections, payload.rawText);

        // The phase endpoint has no separate "template text" field — fold the

        const notes = isTemplate
          ? `${app.notes ? app.notes + '\n\n' : ''}Voice reference (match this style, don't copy it verbatim):\n${app._coverTemplateText}`

        const resp = await backendFetch(`${BACKEND_BASE}/v1/cover-letter`, {

          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instanceId,
            modelId: AppState.settings.modelId,
            jobPosting: app.jdText,
            company: app.company,
            role: app.positionName,
            outputFormat: app.outputFormat || user.outputFormat || 'docx',
            notes,
          }),
          signal: controller.signal,
        });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Cover letter generation failed (${resp.status})`);
      }
      const data = await resp.json();
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const tokens = (data.usage?.input_tokens || 0) + (data.usage?.output_tokens || 0);
      const files = realArtifacts(data.files);
      // P1a (Round 7): same additive "transparency" field as /v1/tailor —
      // see renderStepE's identical comment.
      const transparency = Array.isArray(data.transparency) ? data.transparency : [];

      app.coverLetter = { status: 'done', tokensUsed: tokens, summaryText: text, files, transparency };
      saveApplication(app);

      stopTicker();
      const statusEl = div.querySelector('#cover-status');
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--success)">✓</span> Cover letter complete <span class="token-pill">${fmtTokens(tokens)}</span>`;
      const cancelRow = div.querySelector('#cover-cancel-row');
      if (cancelRow) cancelRow.style.display = 'none';

      const result = div.querySelector('#cover-result');
      if (result) {
        result.style.display = '';
        result.innerHTML = `
          <div class="md-report">${renderMarkdown(text)}</div>
          ${transparency.length > 0 ? `
          <div class="transparency">
            <div class="t-title">Before you download — what the AI inferred vs. verified</div>
            <ul style="margin:0;padding-left:18px">
              ${transparency.map(t => `<li style="margin:3px 0">${escAttr(t)}</li>`).join('')}
            </ul>
          </div>` : ''}
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
            ${files.length > 0
              ? files.map((f, i) => `<a href="#" class="btn btn-primary" data-dl-cover-file="${i}">${icons.dl} Download ${f.split('/').pop()}</a>`).join('')
              : `<div style="font-size:13px;color:var(--warn-text);background:var(--warn-bg);border-radius:var(--radius);padding:8px 12px">No file was generated — see the summary above for why.</div>`}
            <button class="btn btn-secondary" onclick="AppState.wizardStep='F';render()">Try different template</button>
            <button class="btn btn-ghost" onclick="setView('userHome')">Done</button>
          </div>`;
        // P5 fix: real listener + downloadGeneratedFile instead of a bare href.
        result.querySelectorAll('[data-dl-cover-file]').forEach(el => {
          el.onclick = (e) => {
            e.preventDefault();
            downloadGeneratedFile(user.instanceId, files[+el.dataset.dlCoverFile], el);
          };
        });
      }
    } catch (e) {
      stopTicker();
      if (e && e.name === 'AbortError') return; // Cancel already navigated away
      const errEl = div.querySelector('#cover-error');
      if (errEl) { errEl.textContent = `Error: ${e.message}`; errEl.style.display = ''; }
      const retry = document.createElement('button');
      retry.className = 'btn btn-secondary'; retry.style.marginTop = '10px'; retry.textContent = 'Retry';
      retry.onclick = () => { errEl.style.display = 'none'; retry.remove(); run(); };
      errEl.after(retry);
    }
  }

  requestAnimationFrame(run);
  return div;
}

// ─── LIBRARY ──────────────────────────────────────────────────────────────────
function renderLibrary() {
  const user = activeUser();
  if (!user) { setView('home'); return document.createElement('div'); }
  if (!user.library) user.library = { templates: [], infos: [], coverLetters: [] };

  const wrap = document.createElement('div');
  wrap.className = 'fade-in';

  let activeTab = AppState._libTab || 'templates';

  function tabRender() {
    AppState._libTab = activeTab;
    wrap.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <button class="btn btn-ghost btn-sm" onclick="setView('userHome')" aria-label="Back to profile">${icons.back}</button>
        <h2 style="flex:1">Library</h2>
      </div>
      <div class="tabs">
        <button class="tab ${activeTab==='templates'?'active':''}" id="tab-templates">CV Template</button>
        <button class="tab ${activeTab==='infos'?'active':''}" id="tab-infos">CV Info</button>
        <button class="tab ${activeTab==='coverLetters'?'active':''}" id="tab-cl">Cover Letters</button>
      </div>
      <div id="lib-body"></div>`;

    wrap.querySelector('#tab-templates').onclick = () => { activeTab = 'templates'; tabRender(); };
    wrap.querySelector('#tab-infos').onclick = () => { activeTab = 'infos'; tabRender(); };
    wrap.querySelector('#tab-cl').onclick = () => { activeTab = 'coverLetters'; tabRender(); };

    const body = wrap.querySelector('#lib-body');
    if (activeTab === 'templates') renderTemplateTab(body, user, tabRender);
    else if (activeTab === 'infos') renderInfoTab(body, user, tabRender);
    else renderCoverLetterTab(body, user, tabRender);
  }

  tabRender();
  return wrap;
}

function renderTemplateTab(container, user, refresh) {
  const items = user.library.templates || [];
  container.innerHTML = `
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">The visual shell of your CV — layout, columns, fonts. Used for .docx output.</p>
    <div id="tmpl-items"></div>
    <label class="lib-zone" id="tmpl-zone" style="display:block;margin-top:14px">
      ${icons.plus}
      <div style="font-weight:600;font-size:13px;margin-top:4px">Add template — click or drag & drop</div>
      <div style="font-size:12px">.docx or .pdf</div>
      <input type="file" accept=".docx,.pdf" id="tmpl-add-file">
    </label>`;
  const list = container.querySelector('#tmpl-items');
  if (items.length === 0) {
    list.innerHTML = `<div class="empty" style="padding:24px 0"><p>No templates yet.</p></div>`;
  } else {
    items.forEach((t, i) => {
      const isActive = t.id === user.activeTemplateId;
      const row = document.createElement('div');
      row.className = 'lib-item';
      if (isActive) row.style.cssText = 'border-color:var(--accent-text);background:var(--accent-bg)';
      row.innerHTML = `
        <div class="lib-name">${t.name}</div>
        <div class="lib-date">${fmtDate(t.addedAt)}</div>
        ${isActive ? `<span class="badge badge-blue" style="font-size:11px">Active</span>` : `<button class="btn btn-ghost btn-sm" data-set-tmpl="${t.id}">Set active</button>`}
        ${t.b64 ? `<a href="${blobFromB64(t.b64, t.name)}" download="${t.name}" class="btn btn-ghost btn-sm" aria-label="Download ${escAttr(t.name)}">${icons.dl}</a>` : ''}
        <button class="btn btn-ghost btn-sm" data-del-tmpl="${i}" style="color:var(--danger)" aria-label="Delete template ${escAttr(t.name)}">${icons.trash}</button>`;
      list.appendChild(row);
    });
  }
  async function handleTemplateFile(f) {
    if (!f) return;
    const b64 = await fileToB64(f);
    const newId = uid();
    user.library.templates.push({ id: newId, name: f.name, b64, type: f.name.endsWith('.pdf') ? 'pdf' : 'docx', addedAt: Date.now() });
    if (!user.activeTemplateId) user.activeTemplateId = newId;
    saveState(); refresh();
  }
  container.querySelector('#tmpl-add-file').onchange = e => handleTemplateFile(e.target.files[0]);
  const tmplZone = container.querySelector('#tmpl-zone');
  tmplZone.ondragover = e => { e.preventDefault(); tmplZone.classList.add('drag'); };
  tmplZone.ondragleave = () => tmplZone.classList.remove('drag');
  tmplZone.ondrop = e => { e.preventDefault(); tmplZone.classList.remove('drag'); handleTemplateFile(e.dataTransfer.files[0]); };
  list.querySelectorAll('[data-set-tmpl]').forEach(btn => {
    btn.onclick = () => { user.activeTemplateId = btn.dataset.setTmpl; saveState(); refresh(); };
  });
  list.querySelectorAll('[data-del-tmpl]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.delTmpl);
      const delId = user.library.templates[idx]?.id;
      user.library.templates.splice(idx, 1);
      if (user.activeTemplateId === delId) user.activeTemplateId = user.library.templates[0]?.id || null;
      saveState(); refresh();
    };
  });
}

function renderInfoTab(container, user, refresh) {
  const items = user.library.infos || [];
  container.innerHTML = `
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Career content used for gap analysis and tailoring. Can be uploaded or pasted.</p>
    <div id="info-items"></div>
    <div style="display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;align-items:stretch">
      <label class="lib-zone" id="info-zone" style="flex:1;min-width:200px">
        ${icons.plus}
        <div style="font-weight:600;font-size:13px;margin-top:4px">Upload file — click or drag & drop</div>
        <div style="font-size:12px">.docx or .pdf</div>
        <input type="file" accept=".docx,.pdf" id="info-add-file">
      </label>
      <button class="btn btn-secondary btn-sm" id="info-paste-btn">${icons.plus} Paste text</button>
    </div>
    <div id="info-paste-area" style="display:none;margin-top:12px">
      <div class="field-group">
        <label>Paste your CV info</label>
        <textarea id="info-paste-input" rows="10" placeholder="Dump everything here — jobs, skills, education, projects. No formatting needed."></textarea>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <button class="btn btn-ghost btn-sm" id="info-paste-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="info-paste-save">Map & save</button>
        <div id="info-paste-status" style="font-size:13px;color:var(--text2)"></div>
      </div>
    </div>`;
  const list = container.querySelector('#info-items');
  if (items.length === 0) {
    list.innerHTML = `<div class="empty" style="padding:24px 0"><p>No CV info saved yet.</p></div>`;
  } else {
    items.forEach((info, i) => {
      const isActive = info.id === user.activeInfoId;
      const row = document.createElement('div');
      row.className = 'lib-item';
      if (isActive) row.style.cssText = 'border-color:var(--accent-text);background:var(--accent-bg)';
      const srcBadge = info.source === 'paste' ? `<span class="badge badge-gray" style="font-size:10px">pasted</span>` : `<span class="badge badge-gray" style="font-size:10px">file</span>`;
      row.innerHTML = `
        <div class="lib-name">${info.name} ${srcBadge}</div>
        <div class="lib-date">${fmtDate(info.addedAt)}</div>
        ${isActive ? `<span class="badge badge-blue" style="font-size:11px">Active</span>` : `<button class="btn btn-ghost btn-sm" data-set-info="${info.id}">Set active</button>`}
        <button class="btn btn-ghost btn-sm" data-del-info="${i}" style="color:var(--danger)" aria-label="Delete CV info ${escAttr(info.name)}">${icons.trash}</button>`;
      list.appendChild(row);
    });
  }
  async function handleInfoFile(f) {
    if (!f) return;
    const status = document.createElement('div');
    status.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-top:8px';
    status.innerHTML = '<div class="spin"></div> Mapping sections…';
    container.querySelector('#info-items').after(status);
    try {
      const rawText = f.name.endsWith('.pdf') ? await extractPdfText(f) : await extractDocxText(f);
      const { sections } = await runMapCvTask(rawText);
      const newId = uid();
      user.library.infos.push({ id: newId, name: f.name, source: 'upload', mappedSections: sections, addedAt: Date.now() });
      if (!user.activeInfoId) user.activeInfoId = newId;
      saveState(); status.remove(); refresh();
    } catch (err) { status.textContent = `Error: ${err.message}`; status.style.color = 'var(--danger)'; }
  }
  container.querySelector('#info-add-file').onchange = e => handleInfoFile(e.target.files[0]);
  const infoZone = container.querySelector('#info-zone');
  infoZone.ondragover = e => { e.preventDefault(); infoZone.classList.add('drag'); };
  infoZone.ondragleave = () => infoZone.classList.remove('drag');
  infoZone.ondrop = e => { e.preventDefault(); infoZone.classList.remove('drag'); handleInfoFile(e.dataTransfer.files[0]); };
  container.querySelector('#info-paste-btn').onclick = () => { container.querySelector('#info-paste-area').style.display = ''; };
  container.querySelector('#info-paste-cancel').onclick = () => { container.querySelector('#info-paste-area').style.display = 'none'; };
  container.querySelector('#info-paste-save').onclick = async () => {
    const text = container.querySelector('#info-paste-input').value.trim();
    if (!text) return;
    const stat = container.querySelector('#info-paste-status');
    stat.innerHTML = '<span class="spin" style="width:13px;height:13px;border-width:2px;display:inline-block"></span> Mapping…';
    try {
      const { sections } = await runMapCvTask(text);
      const newId = uid();
      user.library.infos.push({ id: newId, name: `Pasted info ${fmtDate(Date.now())}`, source: 'paste', mappedSections: sections, addedAt: Date.now() });
      if (!user.activeInfoId) user.activeInfoId = newId;
      saveState(); refresh();
    } catch (err) { stat.textContent = `Error: ${err.message}`; stat.style.color = 'var(--danger)'; }
  };
  list.querySelectorAll('[data-set-info]').forEach(btn => {
    btn.onclick = () => { user.activeInfoId = btn.dataset.setInfo; saveState(); refresh(); };
  });
  list.querySelectorAll('[data-del-info]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.delInfo);
      const delId = user.library.infos[idx]?.id;
      user.library.infos.splice(idx, 1);
      if (user.activeInfoId === delId) user.activeInfoId = user.library.infos[0]?.id || null;
      saveState(); refresh();
    };
  });
}

function renderCoverLetterTab(container, user, refresh) {

  container.innerHTML = `
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Saved cover letters for reference or reuse.</p>
    <div id="cl-items"></div>
    <label class="lib-zone" id="cl-zone" style="display:block;margin-top:14px">
      ${icons.plus}
      <div style="font-weight:600;font-size:13px;margin-top:4px">Add cover letter — click or drag & drop</div>
      <div style="font-size:12px">.docx, .pdf or .txt</div>
      <input type="file" accept=".docx,.pdf,.txt" id="cl-add-file">
    </label>`;
  const list = container.querySelector('#cl-items');

    list.innerHTML = `<div class="empty" style="padding:24px 0"><p>No cover letters saved yet.</p></div>`;
  } else {

      const row = document.createElement('div');

function blobFromB64(b64, name) {
  const ext = (name || '').split('.').pop().toLowerCase();
  const mimes = { docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', pdf: 'application/pdf', txt: 'text/plain' };
  const mime = mimes[ext] || 'application/octet-stream';
  const bytes = b64ToBytes(b64);
  const blob = new Blob([bytes], { type: mime });
  return URL.createObjectURL(blob);
}

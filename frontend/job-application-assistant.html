<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
// Fallback loader — if cdnjs failed to load mammoth, try jsdelivr
window.addEventListener('load', function() {
  if (typeof mammoth === 'undefined') {
    var s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
    document.head.appendChild(s2);
  }
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Round 8 — full re-theme: field-journal/expedition-tracking identity
     (canvas, brass, contour lines) replacing the warm-paper/blue system.
     Base swatches straight from the design brief; every semantic token
     below was then individually checked against the real WCAG AA
     relative-luminance formula (same Node method Round 7 used for
     --text3) for whatever it's actually paired against in this file —
     see runs\tests\round8_contrast.js and runs\19-implement-round8-pass1.md
     for the full worked numbers. Values were adjusted within each named
     family until every real text/background, button-text/button-bg and
     sidebar-text/sidebar-bg pairing cleared 4.5:1 (normal text) or 3:1
     (large text / UI graphics), exactly as the brief asked for. */
  --ink:#1B1611;--paper:#FAF8F4;--mustard:#C89B3C;--ochre:#A85D2E;--umber:#3E2A1E;--blood:#7A1E1E;

  --bg:var(--paper);--surface:#FFFFFF;--surface2:#F1E9DA;--border:#E4D9C3;--border2:#CBB98F;
  --text:var(--ink);
  /* --text2/--text3: warm umber-grays, not neutral gray — both recompute
     to well clear of 4.5:1 against --bg (#FAF8F4) AND --surface2
     (#F1E9DA), since both sit on either background throughout the app
     (badges, token pills, hint text, model selector). #5C4A3A = 7.93:1 /
     6.98:1; #6B5C4C = 6.07:1 / 5.34:1 — text3 stays visibly lighter than
     text2 (preserves the existing two-step hierarchy) with real margin
     on both backgrounds, not a paper-thin pass. */
  --text2:#5C4A3A;--text3:#6B5C4C;
  /* --accent (raw --mustard) is reserved for BACKGROUND fills and
     decorative borders paired with their own tint — raw mustard measures
     only 2.41:1 against --bg, so it fails AA outright as a text/outline
     color. --accent-text is a darkened, still-golden variant (8.5A17)
     used everywhere the accent hue needs to be legible: links, active-tab
     label, active-step label/number, the user-avatar initials, and
     critically the :focus-visible / input-focus / radio-card-focus-within
     outlines Round 7 added — those must not regress. 5.57:1 on --bg,
     4.90:1 on --accent-bg. See the rule-level comments below for the
     exact call sites this forced a var(--accent)->var(--accent-text) swap. */
  --accent:var(--mustard);--accent-bg:#F6E9CB;--accent-text:#8A5A17;
  /* --ochre-text: darkened --ochre for the one place ochre carries real
     text (the landing tagline) — 6.03:1 on --bg. Raw --ochre stays for
     the topo-line divider motif and other decorative strokes, where it
     is not read as text. */
  --ochre-text:#8F4E24;
  /* success/warn/danger keep their old semantic ROLE (done/caution/error)
     but are re-derived from this palette rather than the old blue-system
     hues: success -> a moss/field green (there's no green in the brief's
     six tokens, but a status color that's indistinguishable from every
     other warm hue here would be a real usability regression, so this is
     a deliberate, documented exception, toned to sit inside the
     expedition/map-legend world rather than a bright SaaS green); warn ->
     ochre-family amber; danger -> --blood. All three recompute >=4.5:1
     both as direct inline text (var(--success)/var(--danger) are used
     bare in several places, not just via their *-bg/*-text pair — grepped
     and confirmed) and paired with their own tint background. */
  --success:#2F5A30;--success-bg:#E6ECDC;--success-text:#2F5A30;
  --warn:#7A431B;--warn-bg:#F5E2CE;--warn-text:#7A431B;
  --danger:var(--blood);--danger-bg:#FBE4E1;--danger-text:#5C1414;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow:0 1px 3px rgba(27,22,17,.08),0 1px 2px rgba(27,22,17,.05);
  --shadow-md:0 4px 12px rgba(27,22,17,.12),0 2px 4px rgba(27,22,17,.06);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;min-height:100vh}
h1{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;line-height:1.2}
h2{font-family:'DM Serif Display',serif;font-size:25px;font-weight:400;line-height:1.3}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none;transition:all .15s}
input,textarea,select{font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;transition:border .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent-text)}
/* P1c (Round 7): the app had exactly one :focus rule total (the line just
   above, text inputs only) against a global button{outline:none} — so
   every button, link and radio-card in the app was invisible when
   keyboard-focused. :focus-visible only fires for keyboard/programmatic
   focus (not mouse clicks), so this restores a real ring for keyboard use
   without bringing back an outline-on-every-click look. Bare pseudo-class
   selector first for maximum coverage (any focusable element, including
   ones not explicitly listed below); the button-specific rule after it is
   redundant belt-and-suspenders against button{outline:none}'s cascade.
   Round 8: raw --accent is now mustard, which only measures 2.41:1 against
   --bg — a focus ring that faint would be a real regression of this exact
   accessibility work, so every focus outline in the file uses
   --accent-text (5.57:1 on --bg) instead, never raw --accent. */
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
button:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
textarea{resize:vertical;line-height:1.6}
a{color:var(--accent-text);text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Layout */
#app{display:flex;flex-direction:column;min-height:100vh;margin-left:60px;transition:margin-left .18s ease}
@media(min-width:601px){body.sidebar-open #app{margin-left:236px}}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
/* Round 8: the wordmark/mark now live in the sidebar and the landing hero
   (the app's real "logo" moment) — this stays as a small, muted, clickable
   "back to Home" label rather than a second competing brand mark. */
.topbar-brand{display:flex;align-items:center;gap:10px;font-family:'DM Serif Display',serif;font-size:17px;color:var(--text3);background:transparent;border:none;padding:0;cursor:pointer}
.topbar-brand:hover{color:var(--text2)}
.topbar-right{display:flex;align-items:center;gap:8px}
.main{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%}

/* Sidebar (Round 8) — cross-cutting nav, collapsed icon rail by default,
   click-to-toggle (not hover) per the brief. Built once at init and never
   innerHTML-rebuilt on render() — only classes/aria attributes toggle —
   specifically to avoid the Round 7 F1 class of bug (innerHTML rebuild
   destroying keyboard focus mid-interaction). Fixed to the viewport at
   z-index 300, above the sticky topbar (100) and the mobile backdrop (250). */
.sidebar{position:fixed;top:0;left:0;height:100vh;width:60px;background:var(--umber);display:flex;flex-direction:column;align-items:stretch;z-index:300;transition:width .18s ease;overflow-x:hidden;overflow-y:auto;border-right:1px solid rgba(0,0,0,.3)}
body.sidebar-open .sidebar{width:236px}
/* The collapsed rail mark IS the toggle button — a compass/crosshair, the
   one signature element for this round (see the landing wordmark for its
   other, matched appearance — same glyph, not two motifs). */
.sidebar-toggle{display:flex;align-items:center;justify-content:center;width:60px;height:60px;flex-shrink:0;background:transparent;color:var(--mustard);border:none;cursor:pointer}
.sidebar-toggle:hover{color:var(--paper)}
.sidebar-toggle svg{width:26px;height:26px;flex-shrink:0}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.sidebar-item{display:flex;align-items:center;gap:14px;width:100%;height:44px;padding:0 18px;background:transparent;border:none;border-left:3px solid transparent;color:#D8CFC0;font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;text-align:left}
.sidebar-item svg{width:19px;height:19px;flex-shrink:0}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:var(--paper)}
/* Active state deliberately does NOT lighten the background — every shade
   of the umber+white blend tested pushed mustard-on-it below 4.5:1 (see
   runs\19-implement-round8-pass1.md). Indicating "current" with a mustard
   left bar + mustard icon/text against the untouched --umber background
   keeps it at the verified 5.28:1 while still reading clearly as selected. */
.sidebar-item.active{border-left-color:var(--mustard);color:var(--mustard)}
.sidebar-item-disabled{opacity:.45;cursor:not-allowed}
.sidebar-item-disabled:hover{background:transparent;color:#D8CFC0}
/* R-1 (Round 8 follow-up, runs\20-review-round8-pass1.md): --accent-text
   (5.57:1) was only ever validated against --paper. This is the app's one
   dark surface, and every one of the sidebar's 5 tab stops focuses on it,
   where that same ring measures just 2.287:1 — below the WCAG 2.4.11/
   1.4.11 3:1 floor for a UI focus indicator. Scoped override to --mustard,
   which measures 5.280:1 on --umber (12.734:1 for --paper, so this rule
   never needs to fire on any lighter surface). Every other :focus-visible
   ring in the file (on --paper/--surface/--accent-bg) is untouched. */
.sidebar :focus-visible{outline-color:var(--mustard)}
.sidebar-label{overflow:hidden;display:flex;align-items:center;gap:8px}
.sidebar-soon{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:2px 6px;border-radius:20px;color:#D8CFC0}
/* Small permanent brand credit, pinned to the bottom of the sidebar rail
   via margin-top:auto on the flex-column .sidebar parent - present in both
   the collapsed (60px) and expanded (236px) states, same as every
   .sidebar-item above it; naturally clipped by the parent's overflow-x:
   hidden when collapsed, exactly like the nav labels are. */
.sidebar-brand{margin-top:auto;padding:14px 18px 16px;font-size:12px;color:#D8CFC0;white-space:nowrap;overflow:hidden;font-family:'DM Sans',sans-serif}
.sidebar-brand-brit{color:#3ECF6E;font-weight:700}
.sidebar-brand-ai{color:#FFD84D;font-weight:700}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,10,6,.4);z-index:250}
@media(max-width:600px){
  body.sidebar-open .sidebar-backdrop{display:block}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius);font-size:16px;font-weight:500;transition:all .15s;cursor:pointer;border:1px solid transparent}
/* Round 8: primary CTA is a solid mustard fill — ink text on it measures
   7.02:1 (white measured 2.41:1 and was replaced). Hover darkens the fill
   itself rather than switching families, keeping the "brass" identity;
   ink on the darker hover fill is 5.49:1, still comfortably AA. */
.btn-primary{background:var(--accent);color:var(--text);border-color:var(--accent)}
.btn-primary:hover{background:#B3872F;border-color:#B3872F}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface2);border-color:var(--border2)}
.btn-ghost{background:transparent;color:var(--text2);border-color:transparent}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-bg)}
.btn-danger:hover{background:#F6C7C2}
.btn-sm{padding:5px 11px;font-size:15px}
.btn-lg{padding:11px 22px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex-shrink:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card-sm{padding:14px 16px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:14px;font-weight:500}
.badge-blue{background:var(--accent-bg);color:var(--accent-text)}
.badge-green{background:var(--success-bg);color:var(--success-text)}
.badge-amber{background:var(--warn-bg);color:var(--warn-text)}
.badge-red{background:var(--danger-bg);color:var(--danger-text)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* Spinner. R-2 (Round 8 follow-up): raw --accent (mustard) on --surface
   measured only 2.558:1 (~2.2x fainter than the pre-redesign blue in this
   same spot) with a near-invisible 1.4:1 track — undercutting Round 7's
   own P0 wait-state work on all four AI-wait screens (evaluate, tailor,
   cover-letter, CV-mapping). --accent-text is 5.906:1 on --surface (a
   decorative UI graphic, so 1.4.11's 3:1 floor applies, but this clears
   even the stricter 4.5:1 text floor with margin); track darkened one
   step to --border2 so the ring itself reads, not just the moving arc. */
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent-text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Divider — Round 8 signature detail: two thin parallel rules standing in
   for a topographic contour line, instead of a single flat rule. Purely
   decorative (same accessibility category as the 1px rule it replaces —
   a visual section break, not information carried by color alone), so no
   contrast minimum applies, but built from --border/--border2, which are
   already the file's own low-contrast line colors, not a new hue. */
.divider{height:6px;margin:20px 0;background-image:linear-gradient(var(--border2) 0 1px,transparent 1px 6px),linear-gradient(var(--border) 0 1px,transparent 1px 6px);background-size:100% 6px;background-position:0 0,0 4px;background-repeat:no-repeat}

/* Model selector */
.model-sel{font-size:15px;padding:5px 8px;border-radius:8px;height:32px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);cursor:pointer}

/* Upload zone */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:32px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text2)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent-text);background:var(--accent-bg);color:var(--accent-text)}
.upload-zone svg{width:32px;height:32px;margin-bottom:8px;opacity:.5}
.upload-zone input[type=file]{display:none}

/* Tab nav */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:8px 16px;font-size:16px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;border-top:none;border-left:none;border-right:none;transition:all .15s}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent-text)}
.tab:hover:not(.active){color:var(--text)}

/* App list item */
.app-item{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.app-item:hover{border-color:var(--border2)}
.app-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.app-item-title{font-weight:600;font-size:17px}
.app-item-sub{font-size:15px;color:var(--text2);margin-top:2px}
.app-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;color:var(--text2)}
.app-row .label{min-width:90px;font-weight:500;color:var(--text)}

/* Step indicator */
.steps{display:flex;gap:0;margin-bottom:28px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.step.done:not(:last-child)::after{background:var(--accent-text)}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text3);z-index:1;transition:all .2s}
.step.active .step-dot{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-bg)}
.step.done .step-dot{border-color:var(--accent);background:var(--accent);color:var(--text)}
.step-label{font-size:13px;color:var(--text3);margin-top:5px;text-align:center}
.step.active .step-label{color:var(--accent-text);font-weight:600}

/* Section label (evaluation / tailoring summary captions) */
.section-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}

/* Token readout */
.token-pill{font-size:13px;font-family:'DM Mono',monospace;background:var(--surface2);color:var(--text3);padding:2px 8px;border-radius:20px;white-space:nowrap}

/* Transparency note */
.transparency{background:var(--warn-bg);border:1px solid #7a431b40;border-radius:var(--radius);padding:14px;font-size:15px;color:var(--warn-text);margin-top:12px}
.transparency .t-title{font-weight:600;margin-bottom:6px}

/* Notification */
.notif{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:var(--radius-lg);font-size:16px;font-weight:500;z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;max-width:320px}
.notif.show{transform:translateY(0);opacity:1}
.notif.success{background:var(--success-bg);color:var(--success-text);border:1px solid #2f5a3050}
.notif.error{background:var(--danger-bg);color:var(--danger-text);border:1px solid #7a1e1e40}

/* Backend-offline banner */
.backend-banner{display:none;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;padding:10px 24px;background:var(--danger-bg);color:var(--danger-text);border-bottom:1px solid #7a1e1e40;font-size:15px;text-align:center}
.backend-banner.show{display:flex}
.backend-banner code{font-family:'DM Mono',monospace;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px}

/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.3}
.empty h3{color:var(--text);margin-bottom:6px}
.empty p{font-size:16px}

/* Wizard layout */
.wizard-box{max-width:640px;margin:0 auto}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field-group .hint{font-size:14px;color:var(--text3);margin-top:4px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap}
/* P1c (Round 7): .radio-card is now applied to a <label> wrapping a real,
   visually-hidden <input type="radio"> (see .sr-only above) instead of a
   bare onclick <div> — the established pattern for accessible card-styled
   choices: keyboard-operable (native radio-group arrow-key/Tab behavior),
   announced correctly by screen readers, and :focus-within here gives the
   whole card a visible ring when its hidden input has keyboard focus. */
.radio-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;flex:1;min-width:140px;position:relative;display:block}
.radio-card.selected{border-color:var(--accent-text);background:var(--accent-bg)}
.radio-card:focus-within{outline:2px solid var(--accent-text);outline-offset:2px}
.radio-card h4{font-size:16px;font-weight:600;margin-bottom:2px}
.radio-card p{font-size:14px;color:var(--text2)}

/* User list */
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.user-card{position:relative;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:all .2s;background:var(--surface);text-align:center}
.user-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.user-avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:23px;color:var(--accent-text);margin:0 auto 10px}
.user-name{font-weight:600;font-size:17px}
.user-meta{font-size:14px;color:var(--text2);margin-top:3px}

/* Profile card 3-dot menu (Round 8 Pass 2) — trigger sits in the card's
   corner; .user-card got position:relative above specifically so the
   trigger/menu can anchor to it. */
.card-menu-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;color:var(--text3);border:none;cursor:pointer;z-index:1}
.card-menu-btn:hover{background:var(--surface2);color:var(--text)}
.dropdown-menu{position:absolute;top:40px;right:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);min-width:172px;z-index:50;padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default}
.dropdown-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);background:transparent;border:none;font-size:15px;color:var(--text);cursor:pointer;width:100%;text-align:left}
.dropdown-item:hover{background:var(--surface2)}
.dropdown-item svg{flex-shrink:0}
.dropdown-item.danger{color:var(--danger-text)}
.dropdown-item.danger:hover{background:var(--danger-bg)}

/* Library */
.lib-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:16px;text-align:center;color:var(--text2);font-size:15px;transition:all .2s;cursor:pointer}
.lib-zone:hover,.lib-zone.drag{border-color:var(--accent-text);background:var(--accent-bg);color:var(--accent-text)}
.lib-zone input[type=file]{display:none}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;background:var(--surface);font-size:15px}
.lib-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}
.lib-item .lib-name{flex:1;font-weight:500}
.lib-item .lib-date{color:var(--text3);font-size:13px}

/* Markdown report rendering (evaluate / tailor / cover summaries) */
.md-report{font-size:16px;line-height:1.65;color:var(--text)}
.md-report .md-h{font-family:'DM Serif Display',serif;font-weight:400;margin:18px 0 8px;line-height:1.3}
.md-report h2.md-h{font-size:23px}
.md-report h3.md-h{font-size:18px;font-family:'DM Sans',sans-serif;font-weight:600}
.md-report h4.md-h,.md-report h5.md-h,.md-report h6.md-h{font-size:16px;font-family:'DM Sans',sans-serif;font-weight:600}
.md-report .md-p{margin:0 0 10px}
.md-report .md-ul,.md-report .md-ol{margin:0 0 12px;padding-left:22px}
.md-report .md-ul li,.md-report .md-ol li{margin:4px 0}
.md-report .md-table{width:100%;border-collapse:collapse;font-size:15px;margin:12px 0 16px}
.md-report .md-table th{text-align:left;padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2)}
.md-report .md-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.md-report .md-table tr:last-child td{border-bottom:none}
.md-report .md-inline-code{font-family:'DM Mono',monospace;font-size:14px;background:var(--surface2);padding:1px 6px;border-radius:4px}
.md-report .md-code{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;overflow-x:auto;font-family:'DM Mono',monospace;font-size:14px;margin:10px 0 14px}
.md-report .md-quote{border-left:3px solid var(--border2);padding:4px 0 4px 12px;margin:8px 0;color:var(--text2)}
.md-report .md-hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.md-report a{color:var(--accent-text)}
.md-report strong{font-weight:600}

/* Landing / rebrand screen (Round 8) — the app's hero. The compass mark
   here is the SAME svg as the sidebar-toggle mark, not a second motif. */
.landing{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:40px 20px}
.landing-hero{max-width:560px;text-align:center}
/* R-3 (Round 8 follow-up): raw --mustard measured only 2.412:1 on --bg —
   the palest thing on its own hero screen, next to a 16.9:1 wordmark,
   undermining the brief's "spend your boldness in one place" signature
   moment. --accent-text (5.568:1 on --bg) gives it real presence; sized
   up from 52px to 64px (mobile 42px->50px) adds weight too, since the
   SVG's stroke scales with its rendered box. Decorative logo mark, so no
   contrast minimum strictly applies, but this clears the 4.5:1 text
   floor anyway with margin. */
.landing-mark{color:var(--accent-text);margin:0 auto 16px;width:64px;height:64px}
.landing-mark svg{width:100%;height:100%}
.landing-wordmark{font-size:64px;letter-spacing:-.01em}
/* Initial emphasis: the J and L are sized up and inked in --accent-text
   (5.57:1 on --bg — raw --mustard fails at 2.41:1, so the emphasized
   letters use the same legible gold as every other accent-text use in
   the file, not a one-off exception). */
.wm-cap{color:var(--accent-text);font-size:1.1em}
.landing-tagline{margin-top:10px;text-transform:uppercase;letter-spacing:.22em;font-size:14px;font-weight:600;color:var(--ochre-text)}
.landing-sub{margin:22px auto 0;max-width:440px;color:var(--text2);font-size:17px;line-height:1.65}
.landing-cta{margin-top:30px}
@media(max-width:600px){.landing-wordmark{font-size:38px}.landing-mark{width:50px;height:50px}}

/* About / AI-provider-connections placeholder screens (Round 8) */
.info-page{max-width:640px;margin:0 auto}
.info-page p{color:var(--text2);font-size:16px;line-height:1.7;margin-bottom:14px}
.info-page p:last-child{margin-bottom:0}
/* Base = connected/green. Round 9 adds .checking (neutral, while a real
   check is in flight) and .danger (red, genuinely disconnected) — used by
   the real status pill on the AI-provider-connections screen and the new
   connectivity-gate screen (renderAiProviders/renderConnectGate). */
.status-pill{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--success-text);background:var(--success-bg);padding:5px 12px;border-radius:20px;margin-bottom:16px}
.status-pill svg{width:14px;height:14px}
.status-pill.checking{color:var(--text2);background:var(--surface2)}
.status-pill.danger{color:var(--danger-text);background:var(--danger-bg)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}

/* Responsive */
@media(max-width:600px){.main{padding:16px}.steps{display:none}}
</style>

<script>
// ─── APP STATE ───────────────────────────────────────────────────────────────
const AppState = {
  // aiPaused (Round 9): app-local, client-side-only "Disconnect" flag — NOT
  // a real Claude Code logout. See aiCallsPaused()/assertAiCallsEnabled()
  // below for what it gates and AI_PAUSED_MESSAGE for the exact user-facing
  // wording. Persisted the same way every other setting is.
  settings: { modelId: 'sonnet-5', maxConcurrent: 3, aiPaused: false },
  users: [],
  // Round 8: every fresh load now opens on the landing/rebrand screen
  // (sidebar "Home"), not directly on the profile chooser — the brief
  // asked for it to "always show on Home," and the landing screen is
  // the app's front door now. view/wizardStep were never persisted
  // (saveState only writes settings/users/applications), so this is
  // simply the in-memory default every page load starts from.
  view: 'landing',
  wizardStep: 'A',
  activeUserId: null,
  activeApplicationId: null,
};

function setView(v, extra = {}) {
  AppState.view = v;
  Object.assign(AppState, extra);
  render();
}

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
// Storage abstraction — tries localStorage, silently falls back to in-memory
const Store = (() => {
  let _mem = {};
  let _available = false;
  try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); _available = true; } catch(e) {}
  return {
    set(key, val) {
      try { if (_available) localStorage.setItem(key, val); else _mem[key] = val; } catch(e) { _mem[key] = val; }
    },
    get(key) {
      try { return _available ? localStorage.getItem(key) : (_mem[key] || null); } catch(e) { return _mem[key] || null; }
    },
    remove(key) {
      try { if (_available) localStorage.removeItem(key); else delete _mem[key]; } catch(e) { delete _mem[key]; }
    }
  };
})();

let _saveTimer;
function saveState() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      const payload = {
        settings: AppState.settings,
        users: AppState.users.map(u => ({
          id: u.id, name: u.name,
          instanceId: u.instanceId || null,
          outputFormat: u.outputFormat || 'docx',
          activeTemplateId: u.activeTemplateId || null,
          activeInfoId: u.activeInfoId || null,
          masterSections: u.masterSections || null,
          masterCvName: u.masterCvName || null,
          masterCvB64: u.masterCvB64 || null,
          coverLetterTemplateB64: u.coverLetterTemplateB64 || null,
          library: u.library || { resumes: [], coverLetters: [] },
          createdAt: u.createdAt,
        })),
        applications: getAllApplications(),
      };
      Store.set('jaa-state', JSON.stringify(payload));
    } catch (e) { console.warn('Save failed', e); }
  }, 600);
}

async function loadState() {
  try {
    const raw = Store.get('jaa-state');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.settings) Object.assign(AppState.settings, data.settings);
    if (data.users) AppState.users = data.users.map(migrateUser);
    if (data.applications) _applications = data.applications;
    document.getElementById('model-sel').value = AppState.settings.modelId;
  } catch (e) { console.warn('Load failed', e); }
}

// ─── APPLICATION STORE ────────────────────────────────────────────────────────
let _applications = [];
function getApplication(id) { return _applications.find(a => a.id === id); }
function getAllApplications() { return _applications; }
function getApplicationsForUser(uid) { return _applications.filter(a => a.userId === uid); }
function saveApplication(app) {
  const idx = _applications.findIndex(a => a.id === app.id);
  if (idx >= 0) _applications[idx] = app; else _applications.push(app);
  saveState();
}
function deleteApplication(id) {
  _applications = _applications.filter(a => a.id !== id);
  saveState();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,10); }
function getUser(id) { return AppState.users.find(u => u.id === id); }
function activeUser() { return getUser(AppState.activeUserId); }
function activeApp() { return getApplication(AppState.activeApplicationId); }

// Migrate old user shape to new library shape (run once on load)
function migrateUser(u) {
  if (u.instanceId === undefined) u.instanceId = null;
  u.outputFormat = u.outputFormat || 'docx';
  if (!u.library) u.library = {};
  if (!u.library.templates) u.library.templates = [];
  if (!u.library.infos) u.library.infos = [];
  if (!u.library.coverLetters) u.library.coverLetters = [];
  // Promote legacy masterCvB64 -> first template entry
  if (u.masterCvB64 && u.library.templates.length === 0) {
    const tid = uid();
    u.library.templates.push({ id: tid, name: u.masterCvName || 'CV Template', b64: u.masterCvB64, type: 'docx', addedAt: u.createdAt || Date.now() });
    u.activeTemplateId = tid;
  }
  // Promote legacy masterSections -> first info entry
  if (u.masterSections && u.library.infos.length === 0) {
    const iid = uid();
    u.library.infos.push({ id: iid, name: u.masterCvName || 'CV Info', source: 'upload', mappedSections: u.masterSections, addedAt: u.createdAt || Date.now() });
    u.activeInfoId = iid;
  }
  if (!u.activeTemplateId && u.library.templates.length > 0) u.activeTemplateId = u.library.templates[0].id;
  if (!u.activeInfoId && u.library.infos.length > 0) u.activeInfoId = u.library.infos[0].id;
  return u;
}

function getActiveTemplate(user) {
  return user.library.templates.find(t => t.id === user.activeTemplateId) || user.library.templates[0] || null;
}
function getActiveInfo(user) {
  return user.library.infos.find(i => i.id === user.activeInfoId) || user.library.infos[0] || null;
}
function getActiveSections(user) {
  const info = getActiveInfo(user);
  return info?.mappedSections || user.masterSections || null;
}
function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtTokens(n) { return n ? `${(n/1000).toFixed(1)}k tokens` : ''; }

// P8 — small, reusable escaper for interpolating a user-typed value into an
// HTML attribute (value="${escAttr(x)}") or into <textarea> element content.
// A raw `"` in an attribute value truncates that attribute on the very next
// re-render; a raw `<` inside <textarea>...</textarea> content can start
// something that looks like a closing tag (e.g. `</textarea>`) and break out
// of the element early. This file had no general-purpose helper for that
// before P8 — only the escaping inlined directly inside renderMarkdown()
// just below (same escape set, applied there to whole markdown documents
// rather than to a single field value).
function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Lightweight markdown → safe HTML for agent reports (evaluate/tailor/cover).
// Handles headings, bold/italic, lists, tables, fenced code, paragraphs.
// Keeps the UI from dumping raw **markdown** with visible asterisks.
function renderMarkdown(src) {
  if (!src) return '';
  let s = String(src).replace(/\r\n/g, '\n');
  // Escape HTML first — and escape quotes too. This was previously a
  // silent no-op (replacing '&' with '&', '<' with '<', etc.) which meant
  // untrusted model output could inject raw tags straight into innerHTML.
  // Quotes are escaped as well so a crafted markdown link can't break out
  // of the href="..." attribute the link rule below generates.
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // Fenced code blocks
  s = s.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, _lang, code) =>
    `<pre class="md-code"><code>${code.replace(/\n$/, '')}</code></pre>`
  );

  // Tables (simple GFM)
  s = s.replace(/(?:^\|.+\|[ \t]*\n){2,}/gm, (block) => {
    const rows = block.trim().split('\n').filter(Boolean);
    if (rows.length < 2) return block;
    const parseRow = (row) => row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const isSep = (row) => /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(row);
    let html = '<table class="md-table"><thead>';
    let i = 0;
    html += '<tr>' + parseRow(rows[0]).map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
    i = isSep(rows[1]) ? 2 : 1;
    for (; i < rows.length; i++) {
      if (isSep(rows[i])) continue;
      html += '<tr>' + parseRow(rows[i]).map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>';
    }
    return html + '</tbody></table>\n';
  });

  // Headings
  s = s.replace(/^######\s+(.+)$/gm, '<h6 class="md-h">$1</h6>');
  s = s.replace(/^#####\s+(.+)$/gm, '<h5 class="md-h">$1</h5>');
  s = s.replace(/^####\s+(.+)$/gm, '<h4 class="md-h">$1</h4>');
  s = s.replace(/^###\s+(.+)$/gm, '<h3 class="md-h">$1</h3>');
  s = s.replace(/^##\s+(.+)$/gm, '<h2 class="md-h">$1</h2>');
  s = s.replace(/^#\s+(.+)$/gm, '<h2 class="md-h">$1</h2>');

  // Horizontal rules
  s = s.replace(/^(-{3,}|\*{3,}|_{3,})\s*$/gm, '<hr class="md-hr">');

  // Blockquotes
  s = s.replace(/^>\s?(.+)$/gm, '<blockquote class="md-quote">$1</blockquote>');

  // Unordered lists (consecutive lines). Greedy (+), not lazy (+?) — lazy
  // here meant each list item became its own separate <ul> instead of
  // consecutive items grouping into one list.
  s = s.replace(/(?:^[\t ]*[-*+]\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split('\n').map(line => line.replace(/^[\t ]*[-*+]\s+/, ''));
    return '<ul class="md-ul">' + items.map(i => `<li>${inlineMd(i)}</li>`).join('') + '</ul>\n';
  });

  // Ordered lists (same greedy fix)
  s = s.replace(/(?:^[\t ]*\d+\.\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split('\n').map(line => line.replace(/^[\t ]*\d+\.\s+/, ''));
    return '<ol class="md-ol">' + items.map(i => `<li>${inlineMd(i)}</li>`).join('') + '</ol>\n';
  });

  // Paragraphs: split on blank lines, skip blocks already wrapped
  s = s.split(/\n{2,}/).map(chunk => {
    const t = chunk.trim();
    if (!t) return '';
    if (/^<(h[1-6]|ul|ol|table|pre|blockquote|hr|div|p)\b/i.test(t)) return t;
    // single-line heading remnants already converted
    if (/^<\/?(h[1-6]|ul|ol|table|pre|blockquote|hr)/i.test(t)) return t;
    // keep internal newlines as <br> inside a paragraph
    return `<p class="md-p">${inlineMd(t).replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  // Merge adjacent blockquotes
  s = s.replace(/(<\/blockquote>\s*)+<blockquote class="md-quote">/g, '<br>');

  return s;
}

function inlineMd(t) {
  if (!t) return '';
  let s = String(t);
  // inline code
  s = s.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');
  // bold ** or __
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  // italic * or _
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/(?<!_)_([^_]+)_(?!_)/g, '<em>$1</em>');
  // links [text](url) — URL body excludes quotes too (defense in depth on
  // top of the entity-escaping in renderMarkdown, which already guarantees
  // no raw quote reaches this point) so a crafted link can never break out
  // of the href="..." attribute.
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function notify(msg, type = 'success') {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.className = `notif ${type} show`;
  setTimeout(() => { el.className = 'notif'; }, 3500);
}

// File to base64
function fileToB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}
function fileToBuffer(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsArrayBuffer(file);
  });
}
async function extractDocxText(file) {
  const buf = await fileToBuffer(file);
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}
async function extractPdfText(file) {
  // Basic PDF text extraction: read as ArrayBuffer and pull raw ASCII text
  // For richer extraction, PizZip won't work on PDFs — we just grab readable chars
  const buf = await fileToBuffer(file);
  const bytes = new Uint8Array(buf);
  let text = '';
  for (let i = 0; i < bytes.length; i++) {
    const c = bytes[i];
    if (c >= 32 && c < 127) text += String.fromCharCode(c);
    else if (c === 10 || c === 13) text += '\n';
  }
  // Clean up excessive whitespace
  text = text.replace(/[^\x20-\x7E\n]/g, '').replace(/ {3,}/g, ' ').replace(/\n{4,}/g, '\n\n').trim();
  if (text.length < 100) throw new Error('Could not extract text from PDF. Try uploading a .docx instead, or use the paste option.');
  return text;
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

// ─── CLAUDE API ───────────────────────────────────────────────────────────────
// Routed through a local backend (see /backend) that uses the Claude Agent SDK
// authenticated via `claude login`, instead of calling api.anthropic.com
// directly (which needs a metered API key and blocks browser CORS anyway).
const CLAUDE_BACKEND_URL = 'http://127.0.0.1:8787/v1/messages';
const BACKEND_BASE = 'http://127.0.0.1:8787';

function fileUrl(instanceId, relPath) {
  return `${BACKEND_BASE}/v1/files?instanceId=${encodeURIComponent(instanceId)}&path=${encodeURIComponent(relPath)}`;
}

// Generated-file downloads (server output under output/ - resumes, cover
// letters) go through fetch -> blob -> a freshly-created, DETACHED
// <a download> -> click() -> cleanup, instead of the bare
// `<a href="${fileUrl(...)}">` links this file used before Implement 3.
//
// What actually changed, and why (P5, then P7 correcting P5's own writeup —
// see runs\11-review-3.md §5.4-5.6 for the full investigation this comment
// summarizes):
//
// The OLD links carried NO `download` attribute at all. That made them
// ordinary top-level navigations, and whether a click turned into a saved
// file (instead of the browser just navigating to/rendering the URL)
// depended entirely on the server's `Content-Disposition: attachment`
// response header and on Chrome's own handling of it — including that this
// server can only emit `filename*=utf-8''...` here, never a plain
// `filename=` fallback, because the generated filenames contain spaces.
// This new path never navigates: it fetches the bytes itself, builds an
// in-memory `blob:` URL, and sets an explicit `a.download = label` on a
// temporary anchor before calling `.click()` — the same pattern already
// used elsewhere in this file for the Library's own downloads
// (`blobFromB64()`, line 2695, called from the template/cover-letter
// download links at lines 2529/2674) and for `doExport()`'s backup-export
// download (line 1034). That is a more standard,
// more robust download mechanism, independent of any server response
// header and independent of the clicked DOM node surviving a re-render.
//
// IMPORTANT — what this fix does NOT establish. An earlier version of this
// comment asserted, as established fact, that a background `setTimeout` in
// renderStepE()'s tailor-completion handler — racing a click on a stale DOM
// node — was THE cause of the owner's "chrome://downloads showed nothing at
// all" report. An independent review (runs\11-review-3.md §5.4) showed
// that theory does not hold up: that setTimeout is one-shot and its entire
// job is to CREATE the resume-preview screen in the first place (it fires
// once, then renders the screen the Download button lives on) — the button
// does not exist until after the timer has already fired, so it cannot
// race a click on a button it hasn't rendered yet. Separately, the premise
// that the click "produced zero network activity" is contradicted by this
// project's own runs\tests\impl2_server.log, whose lines ~13-14/25-26
// record a real 200 OK on `GET /v1/files` from the owner's own browser
// session — so at least once, that download DID reach the server
// successfully. Whatever the owner hit more recently is not proven to be
// that same failure mode. Do not re-assert the setTimeout race as fact.
//
// So: the switch to fetch+blob+detached-anchor below is a genuine
// improvement (it removes navigation as a point of failure, removes any
// dependency on the clicked node surviving a re-render, and finally gives
// failed downloads a visible error toast instead of doing nothing) — but
// the ORIGINAL REPORTED BUG IS NOT CONFIRMED FIXED. No agent on this
// project has ever had a browser tool, so nobody has observed a real
// Chrome click on this code path either produce or fail to produce a
// chrome://downloads entry. That is exactly what the success toast right
// after `a.click()` below is for (P6): once it's live, a real click either
// (a) shows "Downloaded <file>" but chrome://downloads still shows nothing
// — meaning this app-side code worked and the remaining issue is a Chrome /
// antivirus / browser-profile setting outside this codebase's control
// (candidates: Chrome's "ask where to save each file" picker being
// dismissed unnoticed, AV quarantining the file, or checking a different
// Chrome profile/window) — or (b) shows no toast at all, meaning the click
// still isn't reaching this handler and there is a real remaining bug here.
// Either answer is decisive; before P6, neither could be told apart.
// Round 3 correction: the fetch()+blob:URL version of this function (used
// from Implement 3 through the final review) fixed the original "click does
// nothing" report, but introduced a different, confirmed bug - the owner saw
// real completed entries in chrome://downloads, but every one was a bare
// UUID with no extension, unopenable. Root cause: for a blob: URL, Chrome
// only honors the anchor's `download` attribute name while the click is
// still tied to the user's original gesture; `await fetch(...)` + `await
// resp.blob()` both yield to the event loop, so by the time `a.click()` ran,
// that gesture link was already broken, and Chrome fell back to naming the
// saved file after the blob's own internal UUID (its only other option,
// since a blob: URL has no real path). This file's OTHER blob-download
// functions (`blobFromB64`, `doExport`) never hit this because they build
// their blob synchronously from data already in memory - no `await` ever
// comes between the click and `a.click()` for those.
// Fix: don't use blob: at all here. Point the anchor straight at the real
// `/v1/files` URL and click it fully synchronously, so there is no async gap
// to lose the gesture across. The browser's native download path then reads
// the filename the normal way (the `download` attribute / the server's
// `Content-Disposition` header, both already correct), the same as any
// ordinary link - not a JS-constructed blob with no real name of its own.
// The anchor is still created fresh and never inserted into the reactively
// re-rendered DOM, so it stays immune to a hypothetical future re-render
// race regardless.
function downloadGeneratedFile(instanceId, relPath) {
  const label = (relPath || '').split('/').pop() || 'file';
  if (!instanceId || !relPath) {
    notify(`Can't download ${label} — the workspace or file path is missing. Try refreshing.`, 'error');
    return;
  }
  const a = document.createElement('a');
  a.href = fileUrl(instanceId, relPath);
  a.download = label;
  document.body.appendChild(a);
  a.click();
  a.remove();
  notify(`Downloading ${label}…`);
}
window.downloadGeneratedFile = downloadGeneratedFile;

// ─── BACKEND REACHABILITY ─────────────────────────────────────────────────────
// Every prior version of this UI only found out the backend was down when a
// user-triggered action failed, and said so in a near-identical inline error
// box every single time. This probes once on load (see INIT at the bottom)
// and shows one persistent, explanatory banner instead — and every real
// fetch to the backend (via backendFetch below) keeps that status honest as
// the session goes on, so a backend that dies mid-wizard gets caught too.
let _backendOnline = null; // null = not yet checked

function setBackendOnline(isOnline) {
  const was = _backendOnline;
  _backendOnline = isOnline;
  renderBackendBanner();
  if (was === false && isOnline === true) notify('Backend connection restored', 'success');
}

function renderBackendBanner() {
  const el = document.getElementById('backend-banner');
  if (!el) return;
  if (_backendOnline === false) {
    el.className = 'backend-banner show';
    el.innerHTML = `
      <span><strong>Local backend not reachable</strong> at <code>${BACKEND_BASE}</code> — start this project's backend server, then retry. Nothing that calls Claude (mapping a CV, evaluating fit, tailoring, cover letters) will work until it's up.</span>
      <button class="btn btn-sm btn-secondary" id="backend-retry-btn">Retry</button>`;
    const btn = el.querySelector('#backend-retry-btn');
    if (btn) btn.onclick = () => { btn.disabled = true; btn.textContent = 'Checking…'; probeBackend(); };
  } else {
    el.className = 'backend-banner';
    el.innerHTML = '';
  }
}

// A single, side-effect-free reachability check. Uses mode:'no-cors' on
// purpose — we don't need to read the response (and don't want the probe's
// result to depend on the backend's CORS config being right), we only need
// to know whether a TCP connection to that host:port could be made at all.
// A 404 there still means "something is listening," which is all we're
// asking; only a network-level failure (refused/unreachable/timeout) means
// the backend genuinely isn't running.
async function probeBackend() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    await fetch(BACKEND_BASE + '/', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    setBackendOnline(true);
  } catch (e) {
    setBackendOnline(false);
  }
}

// Every real call into the backend goes through this instead of raw fetch()
// so a dead backend is detected and reflected in the banner the moment any
// feature tries to use it, not just at page load.
async function backendFetch(url, opts) {
  let resp;
  try {
    resp = await fetch(url, opts);
  } catch (e) {
    // P0 (Round 7): a user-initiated Cancel (AbortController.abort(), see
    // the wait-screen Cancel buttons below) also lands here as a rejected
    // fetch — but it is NOT a backend outage, and must not be reported as
    // one (that would incorrectly flip the offline banner on every Cancel
    // click). Re-throw the real AbortError untouched so callers can tell
    // "user cancelled" apart from "backend unreachable".
    if (e && e.name === 'AbortError') throw e;
    setBackendOnline(false);
    throw new Error(`Can't reach the local backend at ${BACKEND_BASE}. Make sure it's running, then retry.`);
  }
  if (_backendOnline !== true) setBackendOnline(true); // a completed round trip proves it's up, even on non-2xx statuses
  return resp;
}

// ─── CLAUDE CODE CONNECTION STATUS (Round 9) ───────────────────────────────
// Genuinely different from the backend-reachability check just above:
// probeBackend()/backendFetch/setBackendOnline only prove this local
// Python/FastAPI process is up. They say nothing about whether the Claude
// Agent SDK that process calls into can actually reach an authenticated
// Claude Code session — the `claude` CLI can be logged out, expired, or
// never set up at all while the server itself runs fine. GET
// /v1/claude-status (server\main.py) answers that specifically, with a
// real minimal Agent SDK call server-side — see that endpoint's own
// comment for why a cheaper credential-file check was investigated and
// rejected as unreliable (the CLI's access token is short-lived and
// silently refreshed; a file existing, or even its recorded expiry being
// in the future, doesn't prove a call would actually succeed).
//
// Deliberately NOT probed on every page load or repeatedly in the
// background — only from the AI-provider-connections screen
// (renderAiProviders), its Recheck/Reconnect actions, and once from the
// connectivity-gate screen after "Start Here" (renderConnectGate).
async function checkClaudeStatus() {
  try {
    const resp = await backendFetch(`${BACKEND_BASE}/v1/claude-status`, { method: 'GET' });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      return { connected: false, detail: err.error?.message || `Status check failed (${resp.status})` };
    }
    const data = await resp.json();
    return { connected: !!data.connected, detail: data.detail || '' };
  } catch (e) {
    // backendFetch already flipped the separate backend-offline banner in
    // this case — this function's own return value additionally explains
    // it in its own words, since "the server itself is down" and "the
    // server is up but Claude Code isn't" are different problems with
    // different fixes, and callers of this function want to say the right
    // one rather than a generic failure.
    return { connected: false, detail: e.message || "Can't reach the local backend." };
  }
}

// ─── APP-LOCAL AI PAUSE ("Disconnect", Round 9) ────────────────────────────
// A client-side-only flag — explicitly NOT a real Claude Code logout (this
// project's hard rule: never invoke one). Setting it just means "don't
// attempt AI-backed calls in this app right now." Persisted the same way
// every other setting already is (AppState.settings -> saveState()).
function aiCallsPaused() { return !!AppState.settings.aiPaused; }

const AI_PAUSED_MESSAGE = "AI calls are paused in this app right now. Open 'AI provider connections' in the sidebar and click Reconnect to resume — this does not sign out Claude Code itself, it only pauses this app's use of it.";

// Called at the top of every AI-backed action before it does any network
// work, so a paused session short-circuits with a clear message instead of
// silently attempting the call or failing with a confusing lower-level
// error. Guards all five real AI call sites in this file: callClaude(),
// fetchJdFromUrl(), and Steps D/E/F's /v1/evaluate, /v1/tailor and
// /v1/cover-letter calls (CV-mapping and JD extraction both route through
// callClaude()/callClaudeJSON(), so they're covered there rather than
// needing their own separate checks).
function assertAiCallsEnabled() {
  if (aiCallsPaused()) throw new Error(AI_PAUSED_MESSAGE);
}

// Real generated artifacts only — filters out the docx pipeline's
// intermediate cv/.spec_*.json and any dotfile that might surface.
function realArtifacts(files) {
  return (files || []).filter(p => /\.(docx|tex|pdf)$/i.test(p) && !p.split('/').pop().startsWith('.'));
}

// Idempotently guarantees a backend project instance exists for this user:
// provisions one (POST /v1/users) and writes their collected profile info
// into it (POST /v1/profile) the first time, then just returns the cached id.
// Never blocks profile creation on the backend being reachable — on failure
// this leaves instanceId null and notifies, so a later call can retry.
async function ensureInstance(user) {
  if (user.instanceId) return user.instanceId;
  try {
    const provisionRes = await backendFetch(`${BACKEND_BASE}/v1/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: user.name }),
    });
    if (!provisionRes.ok) throw new Error(`Provisioning failed (${provisionRes.status})`);
    const { id } = await provisionRes.json();

    const { sections, rawText } = resolveProfilePayload(user, null);
    await backendFetch(`${BACKEND_BASE}/v1/profile`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instanceId: id,
        name: user.name,
        outputFormat: user.outputFormat || 'docx',
        sections,
        rawText,
      }),
    });

    user.instanceId = id;
    saveState();
    return id;
  } catch (e) {
    notify(`Could not prepare your workspace: ${e.message}`, 'error');
    return null;
  }
}

// ensureInstance only writes the profile once, at first provision — it never
// re-syncs later. That means swapping the active CV Info (in Library, on the
// user-home "Swap" button, or via a per-application override in Step B) had
// no effect on generation, since the engine only ever reads the instance's
// one profile file. Called at the start of Step D so the instance's profile
// reflects whatever's actually active for THIS application before evaluating
// or tailoring against it - a plain re-write, not an agent call, so it's
// cheap and safe to call on every run.
// Pulls the best available CV payload for THIS application: override from
// Step B first, else the user's active library info. Always prefer carrying
// rawText alongside mapped sections — the backend uses rawText as a hard
// fallback so evaluate never sees a name-only profile again.
function resolveProfilePayload(user, app) {
  const infoId = app?.overrideInfoId || user.activeInfoId;
  const info = (user.library?.infos || []).find(i => i.id === infoId)
    || getActiveInfo(user)
    || null;
  const sections = app?.overrideInfoSections || info?.mappedSections || getActiveSections(user) || null;
  const rawText = app?.overrideInfoRawText || info?.rawText || user.masterCvRawText || null;
  return { sections, rawText, info };
}

async function syncProfileSections(user, sections, rawText) {
  if (!user.instanceId) return;
  try {
    await backendFetch(`${BACKEND_BASE}/v1/profile`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instanceId: user.instanceId,
        name: user.name,
        outputFormat: user.outputFormat || 'docx',
        sections: sections || null,
        rawText: rawText || null,
      }),
    });
  } catch (e) {
    console.warn('Profile sync failed:', e.message);
  }
}

const SKILL_SYSTEM_PROMPT = `You are an expert job application assistant. Your role is to help tailor resumes and cover letters to specific job descriptions.

HONESTY IS NON-NEGOTIABLE. Three categories of content:
1. Source-verified — directly stated in the base resume. Always safe to include.
2. Plausibly transferable — reasonable inference from background. Flag in transparency note.
3. Fabricated — no basis. NEVER include. If JD requires something missing, say so honestly.

When producing JSON output, respond ONLY with valid JSON — no markdown fences, no preamble.`;

// P0 (Round 7): `signal` is an optional AbortSignal, threaded all the way
// down to the actual fetch() call so a wait-screen's real Cancel button
// (see startElapsedTicker/the four wait screens below) can genuinely abort
// an in-flight request, not just stop paying attention to it. Undefined
// when the caller doesn't pass one — behaviour is unchanged for every
// pre-existing call site that doesn't care about cancellation.
async function callClaude({ system, messages, tools, onChunk, signal }) {
  assertAiCallsEnabled(); // Round 9: short-circuit before any network work if paused
  const body = {
    modelId: AppState.settings.modelId,
    max_tokens: 1000,
    system: system || SKILL_SYSTEM_PROMPT,
    messages,
  };
  if (tools) body.tools = tools;

  const resp = await backendFetch(CLAUDE_BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    ...(signal ? { signal } : {}),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `Local backend error (${resp.status})`);
  }
  const data = await resp.json();
  // Collect text from all block types (text, tool_result content)
  let text = '';
  for (const block of (data.content || [])) {
    if (block.type === 'text') text += block.text;
    // tool_result blocks contain nested content arrays
    if (block.type === 'tool_result') {
      for (const inner of (block.content || [])) {
        if (inner.type === 'text') text += inner.text;
      }
    }
  }
  const inputTokens = data.usage?.input_tokens || 0;
  const outputTokens = data.usage?.output_tokens || 0;
  return { text, tokens: inputTokens + outputTokens, data };
}

// Fetch a job posting URL using the web_search tool.
// Returns the page text, or null if unfetchable.
async function fetchJdFromUrl(url, signal) {
  assertAiCallsEnabled(); // Round 9: short-circuit before any network work if paused
  const body = {
    modelId: AppState.settings.modelId,
    max_tokens: 1000,
    tools: [{ type: 'web_search_20250305', name: 'web_search' }],
    messages: [{
      role: 'user',
      content: `Fetch this job posting URL and return the full job description text only — title, company, requirements, responsibilities. URL: ${url}\n\nReturn ONLY the raw job posting text. No commentary, no JSON, no formatting.`
    }]
  };

  // Network-level failures (backend unreachable) propagate to the caller
  // (runJdExtract → Step D's run()) so they surface as a real error there
  // instead of being silently reinterpreted as "this URL can't be scraped."
  // Only a real HTTP error response soft-fails into that path. A user
  // Cancel (AbortError) also propagates — runJdExtract/Step D's run()
  // handles that specially rather than treating it as "URL unfetchable".
  const resp = await backendFetch(CLAUDE_BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    ...(signal ? { signal } : {}),
  });
  if (!resp.ok) return null;

  const data = await resp.json();
  const tokens = (data.usage?.input_tokens || 0) + (data.usage?.output_tokens || 0);

  // Extract text from all content blocks including tool_result
  let text = '';
  for (const block of (data.content || [])) {
    if (block.type === 'text') text += block.text;
    if (block.type === 'tool_result') {
      for (const inner of (block.content || [])) {
        if (inner.type === 'text') text += inner.text;
      }
    }
  }

  const trimmed = text.trim();
  // If nothing came back, or model said it couldn't fetch, signal failure
  if (!trimmed || trimmed.length < 100) return { text: null, tokens };
  const failPhrases = ["can't access", "cannot access", "unable to", "don't have access", "can't browse", "cannot browse"];
  if (failPhrases.some(p => trimmed.toLowerCase().includes(p))) return { text: null, tokens };

  return { text: trimmed, tokens };
}

async function callClaudeJSON({ system, messages, signal }) {
  const { text, tokens } = await callClaude({ system, messages, signal });
  let clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
  // Strip trailing prose after last closing delimiter (object or array)
  const lastBrace = clean.lastIndexOf('}');
  const lastBracket = clean.lastIndexOf(']');
  const lastDelim = Math.max(lastBrace, lastBracket);
  if (lastDelim !== -1) clean = clean.slice(0, lastDelim + 1);
  // Strip leading prose before first opener (models often precede JSON with a short sentence).
  // Prefer the first `{`/`[` that starts its own line - a stray brace/bracket
  // stuffed mid-sentence into prose (e.g. "fill the {placeholder} now") sits
  // after other text on that line, whereas real JSON output almost always
  // opens at the start of a line. Falls back to the naive first-index scan
  // for single-line responses with no line-start opener at all.
  const lineOpenerMatch = /^[ \t]*([{[])/m.exec(clean);
  if (lineOpenerMatch) {
    clean = clean.slice(lineOpenerMatch.index + lineOpenerMatch[0].indexOf(lineOpenerMatch[1])).trim();
  } else {
    const firstBrace = clean.indexOf('{');
    const firstBracket = clean.indexOf('[');
    const starts = [firstBrace, firstBracket].filter(i => i !== -1);
    if (starts.length) clean = clean.slice(Math.min(...starts)).trim();
  }
  try {
    return { json: JSON.parse(clean), tokens };
  } catch (e) {
    // Attempt to salvage truncated JSON by closing open structures
    try {
      let s = clean.replace(/,\s*$/, '');
      let braces = 0, brackets = 0, inStr = false, esc = false;
      for (const ch of s) {
        if (esc) { esc = false; continue; }
        if (ch === '\\' && inStr) { esc = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === '{') braces++; else if (ch === '}') braces--;
        if (ch === '[') brackets++; else if (ch === ']') brackets--;
      }
      s += ']'.repeat(Math.max(0, brackets)) + '}'.repeat(Math.max(0, braces));
      const result = JSON.parse(s);
      console.warn('Salvaged truncated JSON');
      return { json: result, tokens };
    } catch (e2) {
      console.error('JSON parse failed:', clean);
      throw new Error('Response was cut off — try pasting a shorter JD, or pick a faster model from the selector at the top of the page.');
    }
  }
}

const MAP_CV_TASK = `Map a CV into structured regions. Return ONLY a raw JSON object with exactly these keys — no prose, no markdown.

Keys: name, contact, websites, availability, residency, skills, summary, workHistory, education, certifications, projects

Each value is a string. Preserve bullet points as newline-separated lines. Empty sections use "".

{"name":"","contact":"","websites":"","availability":"","residency":"","skills":"","summary":"","workHistory":"","education":"","certifications":"","projects":""}`;

const JD_EXTRACT_TASK = `Extract job posting information from the text provided. Return ONLY a raw JSON object — no prose, no markdown, no explanation.

If the input is only a URL you cannot access, return JSON with jdText set to "URL_UNFETCHABLE" — never write prose about being unable to fetch URLs.

{"positionName":"exact job title or Unknown","company":"company name or Unknown","jdText":"full JD text, or URL_UNFETCHABLE","thinJd":"key requirements in ~200 words or empty string"}`;

// client-side (see runGapAnalysis/runTailorSection/runCoverLetter removal) —
// they're delegated to the engine's real skills via POST /v1/evaluate,
// /v1/tailor, and /v1/cover-letter (see the phase-endpoint calls in Steps D/E/F).

// ─── TASK RUNNERS ─────────────────────────────────────────────────────────────
async function runMapCvTask(cvText, signal) {
  const { json, tokens } = await callClaudeJSON({
    system: MAP_CV_TASK,
    messages: [{ role: 'user', content: `Map this CV into structured regions:\n\n${cvText}` }],
    signal,
  });
  return { sections: json, tokens };
}

async function runJdExtract(jdInput, onStatus, signal) {
  let textToExtract = jdInput;
  let scrapeTokens = 0;
  let scraped = false;

  // If input looks like a URL, attempt to scrape it first
  const isUrl = /^https?:\/\//i.test(jdInput.trim());
  if (isUrl) {
    if (onStatus) onStatus('scraping');
    const result = await fetchJdFromUrl(jdInput.trim(), signal);
    if (result && result.text) {
      textToExtract = result.text;
      scrapeTokens = result.tokens || 0;
      scraped = true;
    } else {
      // Scrape failed — signal caller to ask user to paste
      scrapeTokens = result?.tokens || 0;
      return { extracted: { positionName: 'Unknown', company: 'Unknown', jdText: 'URL_UNFETCHABLE', thinJd: '' }, tokens: scrapeTokens, scraped: false };
    }
  }

  if (onStatus) onStatus('extracting');
  const { json, tokens } = await callClaudeJSON({
    system: JD_EXTRACT_TASK,
    messages: [{ role: 'user', content: `Extract job posting info from:\n\n${textToExtract}` }],
    signal,
  });
  return { extracted: json, tokens: tokens + scrapeTokens, scraped };
}

// buildDocx (the abandoned marker-swap docx design) were removed here — see

// ─── WAIT NARRATIVE (P0, Round 7) ──────────────────────────────────────────
// Shared helpers for this app's four long AI-wait screens (profile-creation
// CV mapping, Step D's fit evaluation, Step E's tailoring, Step F's
// cover-letter writing) — each previously a bare spinner and one static
// line for 30-90+ seconds, with no elapsed time, no cancel, and no sense
// of progress.
//
// IMPORTANT — what this is NOT: this backend has no streaming/phase
// reporting (see agent_client.run_agent / the /v1/* handlers in
// server/main.py — each is one single non-streaming request/response). The
// staged messages below are a client-side SIMULATED narrative for
// perceived-progress purposes only, timed against elapsed wall-clock
// seconds, not a literal report of what the backend is doing right now.
// They're worded as plausible activity ("Reading your profile…") rather
// than as claims about exact backend state, on purpose.
//
// startElapsedTicker(onTick) calls onTick(elapsedSeconds) immediately and
// then ~once per second until the returned stop function is called.
function startElapsedTicker(onTick) {
  const start = Date.now();
  const fire = () => onTick(Math.floor((Date.now() - start) / 1000));
  fire();
  const id = setInterval(fire, 1000);
  return () => clearInterval(id);
}

// stageText picks the message for the latest threshold the elapsed time has
// crossed. `stages` is [[atSeconds, text], ...] sorted ascending.
function stageText(stages, elapsedSeconds) {
  let text = stages[0][1];
  for (const [at, t] of stages) { if (elapsedSeconds >= at) text = t; }
  return text;
}

function doExport() {
  const data = {
    settings: AppState.settings,
    users: AppState.users,
    applications: _applications,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `jaa-backup-${Date.now()}.json`; a.click();

async function doImport(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.users) AppState.users = data.users;
      if (data.applications) _applications = data.applications;
      if (data.settings) Object.assign(AppState.settings, data.settings);
      saveState();
      notify('Backup restored successfully');
      render();
      document.querySelector('[style*="position:fixed"]')?.remove();
    } catch { notify('Invalid backup file', 'error'); }
  };
  r.readAsText(file);
}

// ─── CONNECTIVITY GATE (Round 9) ────────────────────────────────────────────
// Sits between the landing screen and the existing profile chooser. Every
// "Start Here" click lands here first and runs a real, one-time
// checkClaudeStatus() call (the "once at the gate screen" call this
// feature's task scoped, on top of the AI-provider-connections screen's own
// on-view/Recheck calls — never on every page load, never in a background
// poll). Honest by construction: there is no in-app OAuth/login flow, so
// the failure state only ever offers the real fix (a terminal + `claude
// login`) plus Retry — never a fake "Connect" button.
function renderConnectGate() {
  const wrap = document.createElement('div');
  wrap.className = 'fade-in landing';
  wrap.innerHTML = `
    <div class="landing-hero" id="gate-body">
      <div class="status-pill checking" id="gate-pill"><div class="spin" style="width:13px;height:13px;border-width:2px"></div> Checking…</div>
      <h1 id="gate-title" style="margin:6px 0 10px">Checking Claude Code…</h1>
      <p class="landing-sub" id="gate-detail">Confirming this app can reach an authenticated Claude Code session. This usually takes 15-30 seconds.</p>
      <p style="color:var(--text3);font-size:12px;margin:2px 0 0">This check makes one small, real call to Claude Code — not a fake ping — even if AI calls are paused in this app.</p>
      <div id="gate-fix" style="display:none;max-width:440px;margin:16px auto 0;text-align:left"></div>
      <div id="gate-pause-note" style="display:none;max-width:440px;margin:16px auto 0;text-align:left"></div>
      <div style="margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary btn-lg" id="gate-continue" type="button" style="display:none">Continue ${icons.arrow}</button>
        <button class="btn btn-secondary btn-lg" id="gate-retry" type="button" style="display:none">Retry</button>
        <button class="btn btn-ghost" id="gate-back" type="button">${icons.back} Back</button>
      </div>
    </div>`;

  async function runGateCheck() {
    // Re-query every time rather than close over stale references — this
    // function is also the Retry handler, run repeatedly against the same
    // (never innerHTML-rebuilt) elements.
    const pillEl = wrap.querySelector('#gate-pill');
    const titleEl = wrap.querySelector('#gate-title');
    const detailEl = wrap.querySelector('#gate-detail');
    const fixEl = wrap.querySelector('#gate-fix');
    const pauseEl = wrap.querySelector('#gate-pause-note');
    const continueBtn = wrap.querySelector('#gate-continue');
    const retryBtn = wrap.querySelector('#gate-retry');
    if (!pillEl) return;

    pillEl.className = 'status-pill checking';
    pillEl.innerHTML = `<div class="spin" style="width:13px;height:13px;border-width:2px"></div> Checking…`;
    titleEl.textContent = 'Checking Claude Code…';
    detailEl.textContent = 'Confirming this app can reach an authenticated Claude Code session. This usually takes 15-30 seconds.';
    fixEl.style.display = 'none'; fixEl.innerHTML = '';
    continueBtn.style.display = 'none';
    retryBtn.style.display = 'none';

    const status = await checkClaudeStatus();
    if (!document.body.contains(wrap)) return; // navigated away mid-check

    if (status.connected) {
      pillEl.className = 'status-pill';
      pillEl.innerHTML = `${icons.check} Connected`;
      titleEl.textContent = 'Claude Code is reachable';
      detailEl.textContent = status.detail || 'This app can reach an authenticated Claude Code session.';
      continueBtn.style.display = '';
    } else {
      pillEl.className = 'status-pill danger';
      pillEl.innerHTML = `${icons.x} Disconnected`;
      titleEl.textContent = "Couldn't reach Claude Code";
      detailEl.textContent = status.detail || "This app couldn't reach an authenticated Claude Code session.";
      fixEl.style.display = '';
      fixEl.innerHTML = `<div class="transparency" style="margin-top:0"><div class="t-title">How to fix this</div><div>Open a terminal and run <code style="font-family:'DM Mono',monospace;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px">claude login</code>, then click Retry below. This app has no sign-in screen of its own — it only uses whatever session the <code style="font-family:'DM Mono',monospace;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px">claude</code> CLI already has on this machine.</div></div>`;
      retryBtn.style.display = '';
    }

    // Reflect the app-local "Disconnect" pause flag too, so this gate never
    // contradicts it — a real green light here does not by itself mean AI
    // actions will run if the user separately paused them in this app.
    if (aiCallsPaused()) {
      pauseEl.style.display = '';
      pauseEl.innerHTML = `<div class="transparency" style="margin-top:0"><div class="t-title">AI calls are also paused in this app</div><div>From a previous session. Profiles and non-AI features still work; AI-backed actions (evaluate, tailor, cover letter, CV mapping) stay paused until you click Reconnect on "AI provider connections" in the sidebar.</div></div>`;
    } else {
      pauseEl.style.display = 'none';
      pauseEl.innerHTML = '';
    }

    // Brief, unobtrusive auto-advance — connected case only, and only when
    // AI isn't separately paused (that note is worth actually reading, not
    // racing past). Guarded against having navigated away in the meantime,
    // same discipline as Step E's completion-timer guard (P0, Round 7).
    if (status.connected && !aiCallsPaused()) {
      setTimeout(() => {
        if (AppState.view === 'gate') setView('home');
      }, 1400);
    }
  }

  wrap.querySelector('#gate-back').onclick = () => setView('landing');
  wrap.querySelector('#gate-continue').onclick = () => setView('home');
  wrap.querySelector('#gate-retry').onclick = () => runGateCheck();

  requestAnimationFrame(runGateCheck);
  return wrap;
}

// the app-local pause/Disconnect control — see aiCallsPaused()/
// AI_PAUSED_MESSAGE above for what that flag actually does (NOT a real
// Claude Code logout).
function renderAiProviders() {
  const wrap = document.createElement('div');
  wrap.className = 'fade-in info-page';
  wrap.innerHTML = `
    <h1 style="margin-bottom:18px">AI provider connections</h1>
    <div class="card info-page">
      <div id="ai-pause-note" style="display:none"></div>
      <div class="status-pill checking" id="ai-status-pill"><div class="spin" style="width:13px;height:13px;border-width:2px"></div> Checking…</div>

      <div id="ai-status-fix" style="display:none;margin-bottom:14px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn btn-secondary btn-sm" id="ai-recheck-btn" type="button">Recheck</button>
